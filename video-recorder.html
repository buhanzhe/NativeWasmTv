<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f6f8">
  <link rel="icon" href="data:,">
  <title>NTV 视频录制</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:#f5f6f8;color:#1f2933}
    body{font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select{font:inherit}
    .shell{width:min(760px,100%);margin:auto;padding:18px 14px 42px}
    .top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}
    .brand{font-size:14px;font-weight:800;letter-spacing:.045em}
    .connection{display:flex;align-items:center;gap:6px;max-width:62%;padding:7px 10px;border:1px solid #e3e6ea;border-radius:999px;background:#fff;color:#68727d;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#aeb5bd}.connection.online .dot{background:#25c45a;box-shadow:0 0 0 3px rgba(37,196,90,.12)}.connection.bad .dot{background:#ff3b30}
    .card{padding:24px 20px 20px;border:1px solid #e4e6ea;border-radius:22px;background:#fff;box-shadow:0 8px 30px rgba(28,39,49,.055)}
    .identity{text-align:center}
    .file-icon{position:relative;width:62px;height:76px;margin:0 auto 10px;border:5px solid #242a30;border-radius:12px;background:#fff}
    .file-icon:before{content:"";position:absolute;right:-5px;top:-5px;width:23px;height:23px;border-left:5px solid #242a30;border-bottom:5px solid #242a30;border-radius:0 0 0 7px;background:#f5f6f8}
    .live-tag{position:absolute;right:-17px;bottom:8px;padding:4px 7px;border-radius:6px;background:#e93245;color:#fff;font-size:12px;font-weight:800;letter-spacing:.04em}
    .quality{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;color:#34414d}
    .quality select{border:0;background:transparent;color:#34414d;outline:0;padding:4px 20px 4px 5px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#596775 50%),linear-gradient(135deg,#596775 50%,transparent 50%);background-position:calc(100% - 9px) 50%,calc(100% - 5px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
    .meta{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;color:#66717c}
    .badge{padding:3px 7px;border-radius:6px;background:#73808c;color:#fff;font-size:11px;font-weight:750}
    .filename{max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .rename{border:0;background:#f3f5f7;border-radius:8px;padding:6px 8px;color:#1677ff;font-weight:800;cursor:pointer}
    .rename-input{display:none;width:min(430px,100%);margin:9px auto 0;padding:9px 11px;border:1px solid #cfd5db;border-radius:10px;outline:0;text-align:center}.rename-input:focus{border-color:#1677ff;box-shadow:0 0 0 3px rgba(22,119,255,.1)}
    .progress-wrap{height:42px;margin:22px 0 5px;border-radius:7px;background:#e8ebef;overflow:hidden}
    .progress{display:flex;align-items:center;justify-content:center;width:0;height:100%;min-width:0;background:#2587f8;color:#fff;font-weight:800;white-space:nowrap;transition:width .25s ease}
    .progress.indeterminate{width:100%;background-image:linear-gradient(135deg,rgba(255,255,255,.18) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.18) 75%,transparent 75%,transparent);background-size:24px 24px;animation:stripe .8s linear infinite}
    @keyframes stripe{to{background-position:24px 0}}
    .stats{display:flex;justify-content:center;gap:13px;color:#35404a;font-size:16px;font-variant-numeric:tabular-nums;min-height:24px}.stats span{white-space:nowrap}
    .substats{text-align:center;color:#89929c;font-size:11px;min-height:18px;margin-top:2px}
    .controls{display:flex;justify-content:center;gap:16px;margin-top:17px}
    .control{display:flex;align-items:center;justify-content:center;width:62px;height:62px;border:1px solid #e0e4e8;border-radius:13px;background:#fff;box-shadow:0 4px 13px rgba(24,36,48,.08);cursor:pointer;transition:transform .12s ease,opacity .12s ease}.control:active{transform:scale(.95)}.control:disabled{opacity:.35;cursor:default;transform:none}
    .record-shape{width:25px;height:25px;border-radius:50%;background:#e9384a;border:7px solid #e9384a}.recording .record-shape{width:22px;height:22px;border:0;border-radius:5px;background:#e9384a}
    .download-shape{position:relative;width:28px;height:30px;border:3px solid #17202a;border-top:0;border-radius:0 0 5px 5px}.download-shape:before{content:"";position:absolute;left:10px;top:-9px;width:3px;height:20px;background:#17202a}.download-shape:after{content:"";position:absolute;left:5px;top:5px;width:10px;height:10px;border-right:3px solid #17202a;border-bottom:3px solid #17202a;transform:rotate(45deg)}
    .gear{font-size:29px;line-height:1;color:#17202a}
    .notice{display:none;margin-top:14px;padding:13px 14px;border-radius:12px;background:#fff2f1;color:#a52420;line-height:1.55}.notice.show{display:block}.notice b{display:block;margin-bottom:3px}
    .settings{display:none;margin-top:14px;padding:14px;border:1px solid #e6e8ec;border-radius:15px;background:#fafbfc}.settings.show{display:block}
    .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;margin:0 0 5px;color:#77818b;font-size:11px;font-weight:700}.field select,.field input{width:100%;height:42px;padding:8px 10px;border:1px solid #d8dde2;border-radius:10px;background:#fff;outline:0}
    .help{margin:11px 1px 0;color:#7b858e;font-size:11px;line-height:1.55}
    .legal{margin-top:13px;text-align:center;color:#929aa2;font-size:10px;line-height:1.55}.legal a{color:#1677ff;text-decoration:none}
    @media(max-width:520px){.shell{padding:12px 9px 30px}.card{padding:20px 12px 17px;border-radius:18px}.stats{gap:8px;font-size:14px}.settings-grid{grid-template-columns:1fr}.connection{max-width:58%}.progress-wrap{margin-top:18px}}
  </style>
</head>
<body>
<main class="shell">
  <div class="top"><div class="brand">NTV · VIDEO RECORDER</div><div id="connection" class="connection"><span class="dot"></span><span id="connectionText">正在连接电视</span></div></div>
  <section class="card">
    <div class="identity">
      <div class="file-icon"><span class="live-tag">LIVE</span></div>
      <div class="quality"><select id="quality" aria-label="录制清晰度" disabled><option>正在读取清晰度</option></select></div>
      <div class="meta"><span class="badge">文件名</span><span id="filename" class="filename">NTV-Live</span><button class="rename" type="button" onclick="editFilename()">编辑</button></div>
      <input id="filenameInput" class="rename-input" maxlength="80" aria-label="录制文件名">
    </div>
    <div class="progress-wrap"><div id="progress" class="progress">准备录制</div></div>
    <div class="stats"><span id="size">0 B</span><span id="speed">0 KB/s</span><span id="elapsed">00:00:00</span></div>
    <div id="substats" class="substats">等待电视视频流</div>
    <div class="controls">
      <button id="recordButton" class="control" type="button" aria-label="开始录制" onclick="toggleRecording()" disabled><span class="record-shape"></span></button>
      <button id="downloadButton" class="control" type="button" aria-label="保存视频" onclick="downloadRecording()" disabled><span class="download-shape"></span></button>
      <button class="control" type="button" aria-label="录制设置" onclick="toggleSettings()"><span class="gear">⚙</span></button>
    </div>
    <div id="notice" class="notice"></div>
    <div id="settings" class="settings">
      <div class="settings-grid">
        <div class="field"><label for="format">保存格式</label><select id="format" disabled><option value="mp4">MP4</option></select></div>
        <div class="field"><label for="memoryLimit">单次录制上限</label><select id="memoryLimit"><option value="256">256 MB</option><option value="512" selected>512 MB</option><option value="1024">1 GB</option></select></div>
      </div>
      <p class="help">录制和 MP4 合并全部在当前浏览器完成，不会上传视频。较长节目建议分段录制；录制期间请保持页面在前台。</p>
    </div>
  </section>
  <div class="legal">界面参考 FetchV 的录制信息结构，代码为 NTV 独立实现。仅录制你有权保存的内容。<br><a href="https://github.com/buhanzhe/NativeWasmTv" rel="noopener">NativeWasmTv</a></div>
</main>

<script>
/* Browser shim used by FetchV's open HLS/mux bundles for ordinary web fetches. */
(function(){
  function fetchForMux(message,callback){
    if(!message||message.cmd!=='FETCH_DATA'){callback&&callback(null);return}
    var p=message.parameter||{},options={method:p.method||'GET',headers:p.headers||{},cache:'no-store',mode:'cors'};
    try{options.targetAddressSpace=isLoopbackHost(tvHost)?'loopback':'local'}catch(ignore){}
    fetch(p.url,options).then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.arrayBuffer()}).then(function(buffer){callback({ok:true,content:buffer})}).catch(function(error){callback({ok:false,message:error.message})})
  }
  window.chrome=window.chrome||{};
  window.chrome.runtime=window.chrome.runtime||{};
  window.chrome.runtime.sendMessage=fetchForMux;
  window.browser=window.browser||window.chrome;
  window.MediaSource=window.MediaSource||{isTypeSupported:function(){return false}};
})();
</script>
<script src="https://cdn.jsdelivr.net/gh/daoquangphuong/fetchv@ccb34acb844d3145af36681d3221523ec3881501/libs/hls.1.1.2.branch.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/daoquangphuong/fetchv@ccb34acb844d3145af36681d3221523ec3881501/libs/mux.m3u8.min.js"></script>
<script>
var params=new URLSearchParams(location.search),tvHost=(params.get('ip')||'').trim(),tvPort=(params.get('port')||'9966').trim();
var baseUrl='',tvState=null,mediaUrl='',variants=[],recording=false,preparing=false,firstPlaylist=true,pollTimer=null,clockTimer=null,downloadChain=Promise.resolve();
var seen={},segments=[],totalBytes=0,failedSegments=0,recordingStartedAt=0,lastSpeedBytes=0,lastSpeedAt=0,downloadUrl='',downloadExtension='',muxObjectUrls=[];
var recordButton=document.getElementById('recordButton'),downloadButton=document.getElementById('downloadButton'),quality=document.getElementById('quality');

function isLoopbackHost(host){host=String(host||'').toLowerCase().replace(/^\[|\]$/g,'');return host==='127.0.0.1'||host==='localhost'||host==='::1'||host==='0.0.0.0'||/^127\./.test(host)}
function sanitizeHost(host){return String(host||'').replace(/^https?:\/\//i,'').replace(/[\/?#].*$/,'').replace(/:\d+$/,'').trim()}
function localFetch(url,options){options=options||{};options.cache='no-store';options.mode='cors';try{options.targetAddressSpace=isLoopbackHost(tvHost)?'loopback':'local';return fetch(new Request(url,options))}catch(error){delete options.targetAddressSpace;return fetch(url,options)}}
function setConnection(text,state){var box=document.getElementById('connection');box.className='connection'+(state?' '+state:'');document.getElementById('connectionText').textContent=text}
function showNotice(title,message){var box=document.getElementById('notice');box.innerHTML='<b></b><span></span>';box.querySelector('b').textContent=title;box.querySelector('span').textContent=message;box.className='notice show'}
function clearNotice(){document.getElementById('notice').className='notice'}
function setStatus(text,active){var bar=document.getElementById('progress');bar.textContent=text;bar.className='progress'+(active?' indeterminate':'');if(!active)bar.style.width=segments.length?'100%':'0'}
function formatBytes(value){if(value<1024)return value+' B';if(value<1048576)return(value/1024).toFixed(0)+' KB';if(value<1073741824)return(value/1048576).toFixed(2)+' MB';return(value/1073741824).toFixed(2)+' GB'}
function formatTime(seconds){seconds=Math.max(0,Math.floor(seconds||0));var h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return[h,m,s].map(function(v){return String(v).padStart(2,'0')}).join(':')}
function safeFilename(value){return String(value||'NTV-Live').replace(/[\\/:*?"<>|]/g,'-').replace(/^\s+|\s+$/g,'').slice(0,80)||'NTV-Live'}
function defaultFilename(name){var d=new Date(),stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0');return safeFilename((name||'NTV-Live')+'-'+stamp)}
function editFilename(){var label=document.getElementById('filename'),input=document.getElementById('filenameInput');input.value=label.textContent;input.style.display='block';input.focus();input.select();function done(){label.textContent=safeFilename(input.value);input.style.display='none';input.removeEventListener('blur',done);input.removeEventListener('keydown',key)}function key(event){if(event.key==='Enter')done();else if(event.key==='Escape'){input.value=label.textContent;done()}}input.addEventListener('blur',done);input.addEventListener('keydown',key)}
function toggleSettings(){document.getElementById('settings').classList.toggle('show')}

function parseAttributes(text){var result={},regex=/([A-Z0-9-]+)=("[^"]*"|[^,]*)/g,match;while((match=regex.exec(text))){result[match[1]]=match[2].replace(/^"|"$/g,'')}return result}
function parseMasterPlaylist(text,url){
  try{if(window.M3U8Parser&&M3U8Parser.parseMasterPlaylist){var parsed=M3U8Parser.parseMasterPlaylist(text,url),levels=parsed&&parsed.levels||[];if(levels.length)return levels.map(function(level,index){return{url:level.url||level.uri||'',width:Number(level.width)||0,height:Number(level.height)||0,bandwidth:Number(level.bitrate||level.bandwidth)||0,index:index}}).filter(function(item){return item.url})}}catch(ignore){}
  var lines=text.replace(/\r/g,'').split('\n'),items=[];
  for(var i=0;i<lines.length;i++){if(lines[i].indexOf('#EXT-X-STREAM-INF:')!==0)continue;var attrs=parseAttributes(lines[i].slice(18)),next='';for(var j=i+1;j<lines.length;j++){if(lines[j]&&lines[j][0]!=='#'){next=lines[j].trim();i=j;break}}if(!next)continue;var resolution=(attrs.RESOLUTION||'0x0').split('x');items.push({url:new URL(next,url).href,width:Number(resolution[0])||0,height:Number(resolution[1])||0,bandwidth:Number(attrs.BANDWIDTH)||0,index:items.length})}
  return items;
}
function parseMediaPlaylist(text,url){
  try{if(window.M3U8Parser&&M3U8Parser.parseLevelPlaylist){var details=M3U8Parser.parseLevelPlaylist(text,url,0,'main',0),frags=details&&details.fragments||[];if(frags.length)return{target:Number(details.targetduration)||4,segments:frags.map(function(f){return{url:f.url||new URL(f.relurl||'',f.baseurl||url).href,duration:Number(f.duration)||0,discontinuity:Number(f.cc)||0,sn:f.sn}})}}}catch(ignore){}
  var lines=text.replace(/\r/g,'').split('\n'),duration=0,target=4,sequence=0,discontinuity=0,items=[];
  for(var i=0;i<lines.length;i++){var line=lines[i].trim();if(line.indexOf('#EXT-X-TARGETDURATION:')===0)target=Number(line.split(':')[1])||target;else if(line.indexOf('#EXT-X-MEDIA-SEQUENCE:')===0)sequence=Number(line.split(':')[1])||0;else if(line.indexOf('#EXTINF:')===0)duration=parseFloat(line.slice(8))||0;else if(line==='#EXT-X-DISCONTINUITY')discontinuity++;else if(line&&line[0]!=='#'){items.push({url:new URL(line,url).href,duration:duration||target,discontinuity:discontinuity,sn:sequence+items.length});duration=0}}
  return{target:target,segments:items};
}
function variantLabel(item,index){if(item.height)return item.width+'×'+item.height;if(item.bandwidth)return Math.round(item.bandwidth/1000)+' kbps';return'线路 '+(index+1)}
function selectDefaultVariant(){var mode=tvState&&tvState.settings&&tvState.settings.resolutionMode||'high';if(!variants.length)return 0;if(mode==='low')return variants.length-1;if(mode==='medium')return Math.floor((variants.length-1)/2);return 0}
function renderVariants(){quality.innerHTML='';if(!variants.length){var option=document.createElement('option');var r=tvState&&tvState.recording||{};option.textContent=r.width&&r.height?r.width+'×'+r.height:'当前播放清晰度';option.value='direct';quality.appendChild(option);quality.disabled=true;return}variants.sort(function(a,b){return(b.height-a.height)||(b.bandwidth-a.bandwidth)});for(var i=0;i<variants.length;i++){var option=document.createElement('option');option.value=String(i);option.textContent=variantLabel(variants[i],i);quality.appendChild(option)}quality.value=String(selectDefaultVariant());quality.disabled=recording;mediaUrl=variants[Number(quality.value)].url;quality.onchange=function(){if(!recording)mediaUrl=variants[Number(this.value)].url}}

async function connect(){
  tvHost=sanitizeHost(tvHost);
  if(!tvHost){setConnection('缺少电视地址','bad');showNotice('请从电视管理页进入','请先用手机打开电视显示的局域网管理地址，再点击“视频录制”。');return false}
  baseUrl='http://'+tvHost+':'+(Number(tvPort)||9966);
  try{
    var response=await localFetch(baseUrl+'/api/state');if(!response.ok)throw new Error('HTTP '+response.status);tvState=await response.json();if(!tvState.ok)throw new Error(tvState.message||'电视状态不可用');
    setConnection(tvHost+':'+tvPort,'online');clearNotice();var current=tvState.recording||{};document.getElementById('filename').textContent=defaultFilename(current.name||tvState.current&&tvState.current.name);
    if(!current.available){throw new Error('当前频道还没有可录制的视频流')}
    await loadRecordingManifest();recordButton.disabled=false;setStatus('准备录制',false);document.getElementById('substats').textContent=(current.group||'')+(current.name?' · '+current.name:'');return true;
  }catch(error){setConnection('无法连接电视','bad');showNotice('录制服务不可用',error.message+'。若浏览器询问本地网络权限，请选择允许；旧版 Safari/Firefox 可能需要从 HTTP 本地页面打开。');setStatus('连接失败',false);recordButton.disabled=false;return false}
}
async function loadRecordingManifest(){var url=baseUrl+(tvState.recording.playlistPath||'/api/recording/playlist'),response=await localFetch(url);if(!response.ok)throw new Error('读取播放清单失败：HTTP '+response.status);var text=await response.text();variants=parseMasterPlaylist(text,url);if(variants.length){renderVariants()}else{mediaUrl=url;renderVariants()}}

function resetRecording(){if(downloadUrl){URL.revokeObjectURL(downloadUrl);downloadUrl=''}for(var i=0;i<muxObjectUrls.length;i++)URL.revokeObjectURL(muxObjectUrls[i]);muxObjectUrls=[];seen={};segments=[];totalBytes=0;failedSegments=0;firstPlaylist=true;downloadChain=Promise.resolve();recordingStartedAt=Date.now();lastSpeedAt=recordingStartedAt;lastSpeedBytes=0;downloadButton.disabled=true;updateStats()}
async function toggleRecording(){if(preparing)return;if(recording){await stopRecording(false);return}await startRecording()}
async function startRecording(){try{preparing=true;recordButton.disabled=true;var connected=await connect();if(!connected||!tvState||!tvState.recording.available){preparing=false;return}resetRecording();recording=true;preparing=false;recordButton.disabled=false;recordButton.classList.add('recording');recordButton.setAttribute('aria-label','停止录制');quality.disabled=true;setStatus('Live Recording',true);clockTimer=setInterval(updateStats,500);await pollPlaylist()}catch(error){preparing=false;recording=false;recordButton.disabled=false;showNotice('无法开始录制',error.message);setStatus('录制失败',false)}}
async function pollPlaylist(){if(!recording)return;try{var response=await localFetch(mediaUrl);if(!response.ok)throw new Error('HTTP '+response.status);var text=await response.text();if(text.indexOf('#EXT-X-STREAM-INF')>=0){variants=parseMasterPlaylist(text,mediaUrl);renderVariants();mediaUrl=variants[selectDefaultVariant()].url;return schedulePoll(500)}var parsed=parseMediaPlaylist(text,mediaUrl),items=parsed.segments;if(!items.length)throw new Error('播放清单没有可录制分片');var start=0;if(firstPlaylist){for(var i=0;i<items.length-1;i++)seen[items[i].url]=true;start=Math.max(0,items.length-1);firstPlaylist=false}for(var j=start;j<items.length;j++){var item=items[j];if(seen[item.url])continue;seen[item.url]=true;downloadChain=downloadChain.then(downloadSegment.bind(null,item))}schedulePoll(Math.max(700,Math.min(2500,parsed.target*500)))}catch(error){failedSegments++;document.getElementById('substats').textContent='等待新分片 · 重试 '+failedSegments;schedulePoll(Math.min(3000,700+failedSegments*250))}}
function schedulePoll(delay){clearTimeout(pollTimer);if(recording)pollTimer=setTimeout(pollPlaylist,delay)}
async function downloadSegment(item){var lastError=null;for(var attempt=1;attempt<=3;attempt++){try{var response=await localFetch(item.url);if(!response.ok)throw new Error('HTTP '+response.status);var buffer=await response.arrayBuffer(),blob=new Blob([buffer],{type:'video/mp2t'});segments.push({blob:blob,duration:item.duration||4,discontinuity:item.discontinuity||0,sn:item.sn});totalBytes+=buffer.byteLength;failedSegments=0;updateStats();var limit=(Number(document.getElementById('memoryLimit').value)||512)*1048576;if(totalBytes>=limit&&recording){showNotice('已达到单次录制上限','正在停止并合并，请保存后再开始下一段。');setTimeout(function(){stopRecording(true)},0)}return}catch(error){lastError=error;await new Promise(function(resolve){setTimeout(resolve,250*attempt)})}}failedSegments++;document.getElementById('substats').textContent='分片下载失败 '+failedSegments+' 次：'+(lastError&&lastError.message||'未知错误')}
function updateStats(){var now=Date.now(),elapsed=recordingStartedAt?(now-recordingStartedAt)/1000:0,deltaSeconds=Math.max(.25,(now-lastSpeedAt)/1000),speed=recording?(totalBytes-lastSpeedBytes)/deltaSeconds:0;document.getElementById('size').textContent=formatBytes(totalBytes);document.getElementById('speed').textContent=formatBytes(Math.max(0,Math.round(speed)))+'/s';document.getElementById('elapsed').textContent=formatTime(elapsed);document.getElementById('substats').textContent=segments.length+' 个已解密分片'+(failedSegments?' · '+failedSegments+' 次重试':'');lastSpeedAt=now;lastSpeedBytes=totalBytes}
async function stopRecording(autoStopped){if(!recording&&!preparing)return;recording=false;preparing=true;clearTimeout(pollTimer);clearInterval(clockTimer);recordButton.classList.remove('recording');recordButton.disabled=true;setStatus('正在完成分片…',true);try{await downloadChain;if(!segments.length)throw new Error('尚未录制到完整分片');await prepareDownload();setStatus(autoStopped?'已自动停止，可保存':'录制完成，可保存',false);downloadButton.disabled=false}catch(error){showNotice('MP4 合并失败',error.message);setStatus('MP4 合并失败',false)}finally{preparing=false;recordButton.disabled=false;recordButton.setAttribute('aria-label','开始新录制');quality.disabled=variants.length===0;updateStats()}}
function createTsDownload(){var blob=new Blob(segments.map(function(item){return item.blob}),{type:'video/mp2t'});downloadUrl=URL.createObjectURL(blob);downloadExtension='ts'}
async function prepareDownload(){if(downloadUrl){URL.revokeObjectURL(downloadUrl);downloadUrl=''}downloadUrl=await transmuxToMp4();downloadExtension='mp4'}
function transmuxToMp4(){return new Promise(function(resolve,reject){if(typeof Manifest!=='function')return reject(new Error('mux.m3u8.min.js 未加载'));var maxDuration=4,previousCc=null,lines=['#EXTM3U','#EXT-X-VERSION:3','#EXT-X-MEDIA-SEQUENCE:0'];for(var i=0;i<segments.length;i++)maxDuration=Math.max(maxDuration,Math.ceil(segments[i].duration||4));lines.push('#EXT-X-TARGETDURATION:'+maxDuration);for(var j=0;j<segments.length;j++){var item=segments[j];if(previousCc!==null&&item.discontinuity!==previousCc)lines.push('#EXT-X-DISCONTINUITY');previousCc=item.discontinuity;var url=URL.createObjectURL(item.blob);muxObjectUrls.push(url);lines.push('#EXTINF:'+(item.duration||4).toFixed(3)+',');lines.push(url)}lines.push('#EXT-X-ENDLIST');var playlistUrl=URL.createObjectURL(new Blob([lines.join('\n')],{type:'application/vnd.apple.mpegurl'}));muxObjectUrls.push(playlistUrl),finished=false;function complete(url){if(finished)return;finished=true;resolve(url)}function fail(message){if(finished)return;finished=true;reject(new Error(String(message&&message.message||message||'未知错误')))}var ui={_parent:null,options:{autosave:false},loadingDivide:function(){setStatus('正在生成 MP4…',true)},loadingIndex:function(){setStatus('正在解析录制内容…',true)},loadIndexError:fail,loadIndexSuccess:function(){},error:fail,cancel:fail,pause:function(){},completed:function(url,name,part,more){if(!more)complete(url)},start:function(){setStatus('正在转换 MP4…',true)},savePart:function(){},setProgress:function(bytes,cached,total){document.getElementById('substats').textContent='MP4 合并 '+cached+'/'+total},setSpeed:function(){},setThreads:function(){},setErrorRequest:function(){},setPreview:function(){},createThreadsControls:function(){},setTimeSpent:function(){}};try{var manifest=new Manifest({filename:safeFilename(document.getElementById('filename').textContent),headers:{},url:playlistUrl,method:'GET'},ui);ui._parent=manifest;manifest.threadsLimit=2;manifest.loadMaster();setTimeout(function(){if(!finished)fail('MP4 转换超时')},120000)}catch(error){fail(error)}})}
async function downloadRecording(){if(recording)await stopRecording(false);if(!downloadUrl){if(!segments.length){showNotice('没有可保存内容','请先开始录制并等待至少一个完整分片。');return}await prepareDownload()}var link=document.createElement('a');link.href=downloadUrl;link.download=safeFilename(document.getElementById('filename').textContent)+'.mp4';document.body.appendChild(link);link.click();link.remove()}
window.addEventListener('beforeunload',function(event){if(recording){event.preventDefault();event.returnValue='录制仍在进行，离开页面会丢失未保存内容。'}if(downloadUrl)URL.revokeObjectURL(downloadUrl)});
connect();
