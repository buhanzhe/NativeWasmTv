<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <link rel="icon" href="data:,">
  <title>NTV 手机飞鼠</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{background:#f7f7f8}
    body{margin:0;min-height:100vh;color:#1d1d1f;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    main{width:100%;max-width:520px;margin:auto;padding:13px 10px 32px}
    .top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
    .title{font-size:16px;font-weight:750}.online{display:flex;align-items:center;padding:6px 10px;background:#fff;border:1px solid #e8e8eb;border-radius:999px;color:#48484a;font-size:11px;font-weight:650}
    .dot{width:6px;height:6px;margin-right:6px;background:#ff9f0a;border-radius:50%}.online.ok .dot{background:#30d158}.online.bad .dot{background:#ff453a}
    section{padding:13px;background:linear-gradient(180deg,#fff,#fbfffc);border:1px solid #d8e8db;border-radius:16px}
    button,input{font:inherit}button{min-height:42px;padding:9px 11px;border:1px solid #dcdce1;border-radius:12px;background:#fff;color:#1d1d1f;font-weight:650;cursor:pointer}button:active{transform:scale(.975);background:#ebebef}button:disabled{opacity:.42;transform:none}
    .primary{background:#1d1d1f;border-color:#1d1d1f;color:#fff}.actions{display:flex;gap:8px;margin-top:9px}.actions button{flex:1}
    .switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 2px 10px}.switch-copy b{display:block;font-size:13px}.hint{margin:2px 0 0;color:#77777c;font-size:11px;line-height:1.45}
    .switch-row input{-webkit-appearance:none;appearance:none;position:relative;flex:0 0 auto;width:43px;height:26px;padding:0;border:0;border-radius:999px;background:#d2d2d7;outline:none}.switch-row input:before{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.22);transition:transform .2s}.switch-row input:checked{background:#34c759}.switch-row input:checked:before{transform:translateX(17px)}
    .controls{transition:opacity .16s}.controls.off{opacity:.42;pointer-events:none}.touchpad{height:min(46vh,360px);min-height:230px;margin-top:10px;border:1px solid #d7d7dc;border-radius:15px;background:radial-gradient(circle at center,#f7f7f9 0,#eeeef2 100%);display:flex;align-items:center;justify-content:center;color:#77777c;font-size:12px;font-weight:650;touch-action:none;user-select:none}.touchpad.active{border-color:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.12);color:#248a3d}
    .control-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:8px 0 10px;padding:4px;background:#ededf0;border-radius:13px}.control-modes button{min-height:35px;padding:6px 5px;border:0;border-radius:9px;background:transparent;color:#636366;font-size:12px}.control-modes button.active{background:#fff;color:#1d1d1f;box-shadow:0 1px 4px rgba(0,0,0,.12)}
    .control-panel{display:none}.control-panel.active{display:block}.keyboard-note{text-align:center;margin:2px 0 7px;color:#8a8a8f;font-size:10px}.keyboard-input{display:flex;gap:7px;margin-bottom:8px}.keyboard-input input{flex:1;min-width:0;height:42px;padding:8px 10px;border:1px solid #dcdce1;border-radius:11px}.keyboard-input button{flex:0 0 auto}.keyboard{display:flex;flex-direction:column;gap:5px;user-select:none;touch-action:manipulation}.keyboard-row{display:flex;justify-content:center;gap:4px}.key{flex:1;min-width:0;min-height:38px;padding:5px 2px;border-radius:8px;font-size:11px}.key.wide{flex:1.55}.key.space{flex:5}.key.accent{background:#e8f2ff;border-color:#c5ddfa;color:#0066cc}.key.accent.primary{background:#0071e3;color:#fff}.key.dark{background:#343438;border-color:#343438;color:#fff}
    .gamepad{display:grid;grid-template-columns:1fr minmax(120px,1.15fr) 1fr;align-items:center;gap:13px;padding:6px 4px 2px;user-select:none}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);justify-content:center}.dpad button{min-height:44px;padding:0;border-radius:12px;font-size:19px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .ok{grid-column:2;grid-row:2;background:#1d1d1f;color:#fff}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}.pad-center{display:flex;flex-direction:column;gap:7px}.shoulders{display:flex;gap:6px}.shoulders button{flex:1;min-height:37px;font-size:11px}.pad-center .actions{margin:0}.face-pad{position:relative;width:154px;height:154px;margin:auto}.face-pad button{position:absolute;width:50px;height:50px;min-height:50px;padding:0;border-radius:50%;color:#fff;border:0;font-weight:800}.face-a{right:0;top:52px;background:#30a14e}.face-b{right:52px;bottom:0;background:#ff453a}.face-x{left:0;top:52px;background:#0a84ff}.face-y{right:52px;top:0;background:#ff9f0a}.pad-caption{text-align:center;color:#8a8a8f;font-size:10px;margin-top:7px}
    .status{margin-top:8px;color:#77777c;font-size:11px;line-height:1.45}.message{position:fixed;left:5%;right:5%;bottom:18px;max-width:460px;margin:auto;padding:11px 14px;background:#1d1d1f;color:#fff;border-radius:12px;display:none;text-align:center;font-size:12px;font-weight:650}.message.bad{background:#ff3b30}
    .setup{display:none;margin-top:10px;border-color:#ffd8a8;background:#fffaf3}.setup.show{display:block}.setup h2{font-size:15px;margin:0 0 8px}.setup p{margin:0;color:#77777c;font-size:11px;line-height:1.55}.address{font-variant-numeric:tabular-nums}
    @media(max-width:520px){.gamepad{grid-template-columns:1fr 1fr}.pad-center{grid-column:1/3;grid-row:2}.dpad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(3,43px)}.face-pad{width:138px;height:138px}.face-pad button{width:46px;height:46px;min-height:46px}.face-a,.face-x{top:46px}.face-b{right:46px}.face-y{right:46px}}
    @media(orientation:landscape) and (max-height:600px){main{max-width:none;padding:5px 10px 9px}.top{margin-bottom:3px}.top button{min-height:32px}section{padding:6px 12px}.switch-row{padding:0 2px 3px}.touchpad{height:calc(100vh - 172px);min-height:120px}.control-modes{margin:3px 0 4px;padding:3px}.control-modes button{min-height:29px}.keyboard-note{display:none}.keyboard-input{margin-bottom:4px}.keyboard-input input,.keyboard-input button{min-height:33px;height:33px}.keyboard{gap:3px}.keyboard-row{gap:3px}.key{min-height:29px}.gamepad{max-width:760px;margin:auto;padding-top:0}.status{margin-top:3px}}
  </style>
</head>
<body>
<main>
  <div class="top"><button onclick="backToManager()">‹ 返回</button><div class="title">手机飞鼠</div><div id="online" class="online"><span class="dot"></span><span id="connectionText">连接中</span></div></div>
  <section>
    <div class="switch-row"><div class="switch-copy"><b>显示电视光标</b><div id="mouseHint" class="hint address">正在连接电视…</div></div><input id="mouseEnabled" aria-label="显示电视光标" type="checkbox" onchange="saveMouseEnabled()"></div>
    <div id="controls" class="controls off">
      <div class="control-modes"><button id="modeTouch" class="active" onclick="switchControlMode('touch')">触控板</button><button id="modeKeyboard" onclick="switchControlMode('keyboard')">全键盘</button><button id="modeGamepad" onclick="switchControlMode('gamepad')">游戏手柄</button></div>
      <div id="panelTouch" class="control-panel active">
        <div class="actions"><button id="gyroButton" class="primary" onclick="enableGyroscope()">启用陀螺仪</button><button onclick="calibrateGyroscope()">重新校准</button></div>
        <div id="touchpad" class="touchpad">单指移动 · 轻触点击 · 双指滚动</div>
        <div class="actions"><button onclick="pointerAction('click')">点击</button><button onclick="pointerAction('back')">电视返回</button><button onclick="pointerAction('reset')">光标居中</button></div>
      </div>
      <div id="panelKeyboard" class="control-panel">
        <div class="keyboard-note">建议旋转手机横屏；文字框支持手机中文输入法</div>
        <div class="keyboard-input"><input id="remoteText" type="text" autocomplete="off" placeholder="输入文字后发送到电视网页焦点"><button class="primary" onclick="sendRemoteText()">发送</button></div>
        <div class="keyboard">
          <div class="keyboard-row"><button class="key wide" onclick="remoteKey('escape')">Esc</button><button class="key" onclick="remoteKey('1')">1</button><button class="key" onclick="remoteKey('2')">2</button><button class="key" onclick="remoteKey('3')">3</button><button class="key" onclick="remoteKey('4')">4</button><button class="key" onclick="remoteKey('5')">5</button><button class="key" onclick="remoteKey('6')">6</button><button class="key" onclick="remoteKey('7')">7</button><button class="key" onclick="remoteKey('8')">8</button><button class="key" onclick="remoteKey('9')">9</button><button class="key" onclick="remoteKey('0')">0</button><button class="key" onclick="remoteKey('minus')">-</button><button class="key" onclick="remoteKey('equals')">=</button><button class="key wide" data-repeat-key="backspace">⌫</button></div>
          <div class="keyboard-row"><button class="key wide" onclick="remoteKey('tab')">Tab</button><button class="key" onclick="remoteKey('q')">Q</button><button class="key" onclick="remoteKey('w')">W</button><button class="key" onclick="remoteKey('e')">E</button><button class="key" onclick="remoteKey('r')">R</button><button class="key" onclick="remoteKey('t')">T</button><button class="key" onclick="remoteKey('y')">Y</button><button class="key" onclick="remoteKey('u')">U</button><button class="key" onclick="remoteKey('i')">I</button><button class="key" onclick="remoteKey('o')">O</button><button class="key" onclick="remoteKey('p')">P</button><button class="key" onclick="remoteKey('leftbracket')">[</button><button class="key" onclick="remoteKey('rightbracket')">]</button><button class="key" onclick="remoteKey('backslash')">\</button></div>
          <div class="keyboard-row"><button id="ctrlKey" class="key wide accent" onclick="toggleModifier('ctrl')">Ctrl</button><button class="key" onclick="remoteKey('a')">A</button><button class="key" onclick="remoteKey('s')">S</button><button class="key" onclick="remoteKey('d')">D</button><button class="key" onclick="remoteKey('f')">F</button><button class="key" onclick="remoteKey('g')">G</button><button class="key" onclick="remoteKey('h')">H</button><button class="key" onclick="remoteKey('j')">J</button><button class="key" onclick="remoteKey('k')">K</button><button class="key" onclick="remoteKey('l')">L</button><button class="key" onclick="remoteKey('semicolon')">;</button><button class="key" onclick="remoteKey('apostrophe')">'</button><button class="key wide dark" onclick="remoteKey('enter')">Enter</button></div>
          <div class="keyboard-row"><button id="shiftKey" class="key wide accent" onclick="toggleModifier('shift')">Shift</button><button class="key" onclick="remoteKey('z')">Z</button><button class="key" onclick="remoteKey('x')">X</button><button class="key" onclick="remoteKey('c')">C</button><button class="key" onclick="remoteKey('v')">V</button><button class="key" onclick="remoteKey('b')">B</button><button class="key" onclick="remoteKey('n')">N</button><button class="key" onclick="remoteKey('m')">M</button><button class="key" onclick="remoteKey('comma')">,</button><button class="key" onclick="remoteKey('period')">.</button><button class="key" onclick="remoteKey('slash')">/</button></div>
          <div class="keyboard-row"><button id="altKey" class="key wide accent" onclick="toggleModifier('alt')">Alt</button><button class="key" onclick="remoteKey('home')">Home</button><button class="key space" onclick="remoteKey('space')">空格</button><button class="key" onclick="remoteKey('end')">End</button><button class="key" data-repeat-key="left">←</button><button class="key" data-repeat-key="down">↓</button><button class="key" data-repeat-key="up">↑</button><button class="key" data-repeat-key="right">→</button></div>
        </div>
      </div>
      <div id="panelGamepad" class="control-panel">
        <div class="gamepad">
          <div class="dpad"><button class="up" data-repeat-key="up">▲</button><button class="left" data-repeat-key="left">◀</button><button class="ok" onclick="remoteKey('enter')">OK</button><button class="right" data-repeat-key="right">▶</button><button class="down" data-repeat-key="down">▼</button></div>
          <div class="pad-center"><div class="shoulders"><button data-repeat-key="pageup">L1 · 上页</button><button data-repeat-key="pagedown">R1 · 下页</button></div><div class="actions"><button onclick="pointerAction('back')">返回</button><button onclick="pointerAction('menu')">菜单</button></div><div class="actions"><button onclick="remoteKey('volumeup')">音量＋</button><button onclick="remoteKey('volumedown')">音量－</button></div></div>
          <div class="face-pad"><button class="face-y" onclick="remoteKey('playpause')">Y</button><button class="face-x" onclick="pointerAction('click')">X</button><button class="face-a" onclick="remoteKey('enter')">A</button><button class="face-b" onclick="pointerAction('back')">B</button></div>
        </div>
        <div class="pad-caption">A 确认 · B 返回 · X 光标点击 · Y 播放/暂停 · L1/R1 翻页</div>
      </div>
      <div id="sensorStatus" class="status">像遥控器一样握持；移动、指向或旋转手机控制光标。</div>
    </div>
  </section>
  <section id="setup" class="setup"><h2>无法连接电视</h2><p id="setupText"></p></section>
</main>
<div id="message" class="message"></div>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search),host=params.get('ip')||'',port=params.get('port')||'9966';
  var validHost=/^(?:\d{1,3}\.){3}\d{1,3}$/.test(host)||/^[a-z0-9.-]+$/i.test(host),validPort=/^\d{1,5}$/.test(port)&&Number(port)>0&&Number(port)<65536;
  var apiBase=validHost&&validPort?'http://'+host+':'+port:'',targetAddressSpace=/^(127\.|localhost$)/i.test(host)?'loopback':'local';
  var state=null,pointerBusy=false,pendingDx=0,pendingDy=0,messageTimer=null,pointerScale=1,remoteModifiers={shift:false,ctrl:false,alt:false};
  var gyroRunning=false,gyroSeen=false,gyroYawRate=0,gyroPitchRate=0,gyroRollRate=0,filteredYawRate=0,filteredPitchRate=0,gyroHasYaw=false,genericGyroscope=null,lastSensorName='',lastSensorAt=0,lastRateAt=0,lastMotionRateAt=0,lastOrientationRateAt=0,lastOrientationAlpha=null,lastOrientationBeta=null,lastOrientationGamma=null,lastOrientationAt=0,orientationEventType='',lastGravityPitch=null,lastGravityAt=0,lastGyroFrameAt=0,gravityFlatWeight=1,lastMotionAt=0,lastTranslationAt=0,filteredAccelX=0,filteredAccelY=0,translationVelocityX=0,translationVelocityY=0;
  window.backToManager=function(){if(apiBase)location.href=apiBase+'/index.html';else history.back()};
  function request(path,body){if(!apiBase)return Promise.reject(new Error('地址参数无效'));var options={method:body?'POST':'GET',mode:'cors',cache:'no-store',targetAddressSpace:targetAddressSpace,headers:{'Accept':'application/json'}};if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}return fetch(apiBase+path,options).then(function(response){if(!response.ok)throw new Error('电视返回 '+response.status);return response.json()}).then(function(data){if(data.ok===false)throw new Error(data.message||'请求失败');return data})}
  function setConnection(ok,text){var online=document.getElementById('online');online.className='online '+(ok?'ok':'bad');document.getElementById('connectionText').textContent=text}
  function showSetup(text){document.getElementById('setup').className='setup show';document.getElementById('setupText').textContent=text}
  function connect(){if(!apiBase){setConnection(false,'地址无效');showSetup('请使用 ?ip=电视IP&port=端口 打开本页，例如：?ip=192.168.1.20&port=9966');return}request('/api/state').then(function(data){state=data;var width=data.display&&Number(data.display.width);pointerScale=width>0?Math.max(.75,Math.min(3,width/1280)):1;setConnection(true,'电视在线');document.getElementById('setup').className='setup';var input=document.getElementById('mouseEnabled');input.checked=data.settings.flyMouseEnabled===true;updateControls()}).catch(function(error){setConnection(false,'连接失败');showSetup('请确认手机与电视在同一局域网，并允许浏览器访问本地网络。目标：'+apiBase+'。'+error.message)})}
  function updateControls(){var enabled=document.getElementById('mouseEnabled').checked,controls=document.getElementById('controls'),buttons=controls.getElementsByTagName('button');controls.className='controls'+(enabled?'':' off');document.getElementById('mouseHint').textContent=enabled?'电视光标已开启':(apiBase?host+':'+port:'未配置电视地址');for(var i=0;i<buttons.length;i++)buttons[i].disabled=!enabled}
  window.saveMouseEnabled=function(){var input=document.getElementById('mouseEnabled');updateControls();request('/api/settings',{flyMouseEnabled:input.checked}).then(function(){if(state)state.settings.flyMouseEnabled=input.checked;toast(input.checked?'电视光标已开启':'电视光标已关闭')}).catch(function(error){input.checked=!input.checked;updateControls();toast(error.message,true)})};
  function pointerMove(dx,dy){pendingDx=Math.max(-240,Math.min(240,pendingDx+dx));pendingDy=Math.max(-240,Math.min(240,pendingDy+dy));flushPointerMove()}
  function flushPointerMove(){if(pointerBusy||Math.abs(pendingDx)+Math.abs(pendingDy)<.15)return;var dx=pendingDx,dy=pendingDy;pendingDx=0;pendingDy=0;pointerBusy=true;request('/api/pointer',{action:'move',dx:dx,dy:dy}).catch(function(error){setSensorStatus(error.message,true)}).then(function(){pointerBusy=false;flushPointerMove()})}
  window.pointerAction=function(action,value){var body={action:action};if(action==='scroll')body.scrollY=value||0;request('/api/pointer',body).then(function(){if(action==='reset')toast('电视光标已居中')}).catch(function(error){toast(error.message,true)})};
  window.switchControlMode=function(mode){var names=['Touch','Keyboard','Gamepad'];for(var i=0;i<names.length;i++){var active=names[i].toLowerCase()===mode;document.getElementById('mode'+names[i]).className=active?'active':'';document.getElementById('panel'+names[i]).className='control-panel'+(active?' active':'')}try{localStorage.setItem('ntvControlMode',mode)}catch(error){}if(!gyroRunning)setSensorStatus(mode==='keyboard'?'按键发送到当前网页焦点；文字框支持中文输入。':mode==='gamepad'?'方向键可长按；A 确认，B 返回，X 点击。':'像遥控器一样握持；移动、指向或旋转手机控制光标。',false);if((mode==='keyboard'||mode==='gamepad')&&innerHeight>innerWidth)toast('旋转手机横屏，操作空间更大')};
  function updateModifierButtons(){var names=['shift','ctrl','alt'];for(var i=0;i<names.length;i++){var button=document.getElementById(names[i]+'Key');if(button)button.className='key wide accent'+(remoteModifiers[names[i]]?' primary':'')}}
  window.toggleModifier=function(name){remoteModifiers[name]=!remoteModifiers[name];updateModifierButtons()};
  window.remoteKey=function(key){request('/api/pointer',{action:'key',key:key,shift:remoteModifiers.shift,ctrl:remoteModifiers.ctrl,alt:remoteModifiers.alt}).catch(function(error){toast(error.message,true)});if(key.length===1||key==='space'||key==='enter'||key==='tab'){remoteModifiers={shift:false,ctrl:false,alt:false};updateModifierButtons()}};
  window.sendRemoteText=function(){var input=document.getElementById('remoteText'),text=input.value;if(!text){toast('请先输入文字',true);return}request('/api/pointer',{action:'text',text:text}).then(function(){input.value='';toast('文字已发送到电视网页')}).catch(function(error){toast(error.message,true)})};
  function setupRemoteControls(){var input=document.getElementById('remoteText');if(input)input.addEventListener('keydown',function(event){if(event.key==='Enter'){event.preventDefault();window.sendRemoteText()}});var buttons=document.querySelectorAll('[data-repeat-key]'),timerId=null,repeatId=null;function stop(){clearTimeout(timerId);clearInterval(repeatId);timerId=null;repeatId=null}for(var i=0;i<buttons.length;i++){(function(button){function start(event){stop();window.remoteKey(button.getAttribute('data-repeat-key'));timerId=setTimeout(function(){repeatId=setInterval(function(){window.remoteKey(button.getAttribute('data-repeat-key'))},105)},360);if(event)event.preventDefault()}button.addEventListener('touchstart',start,{passive:false});button.addEventListener('touchend',stop,false);button.addEventListener('touchcancel',stop,false);button.addEventListener('mousedown',start,false);button.addEventListener('mouseup',stop,false);button.addEventListener('mouseleave',stop,false)})(buttons[i])}var mode='touch';try{mode=localStorage.getItem('ntvControlMode')||'touch'}catch(error){}if(mode!=='keyboard'&&mode!=='gamepad')mode='touch';window.switchControlMode(mode)}
  function setSensorStatus(text,bad){var element=document.getElementById('sensorStatus');element.textContent=text;element.style.color=bad?'#ff3b30':'#248a3d'}
  window.enableGyroscope=function(){if(gyroRunning){stopGyroscope();return}if(!document.getElementById('mouseEnabled').checked){toast('请先开启电视光标',true);return}var requests=[],denied=false;if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')requests.push(function(){return DeviceOrientationEvent.requestPermission()});if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')requests.push(function(){return DeviceMotionEvent.requestPermission()});if(!requests.length){startGyroscope();return}var remaining=requests.length;function finished(result){if(result!=='granted')denied=true;remaining--;if(!remaining){if(denied)setSensorStatus('动作与方向权限未开启，请在浏览器网站设置中允许。',true);else startGyroscope()}}for(var i=0;i<requests.length;i++){try{var promise=requests[i]();if(promise&&promise.then)promise.then(finished,function(){finished('denied')});else finished('granted')}catch(error){finished('denied')}}};
