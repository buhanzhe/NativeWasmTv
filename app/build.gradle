apply plugin: 'com.android.application'

import groovy.json.JsonOutput
import java.security.MessageDigest

def releaseSigningDirectory = rootProject.file('.signing')
def releaseKeystore = new File(releaseSigningDirectory, 'iptv-release.jks')
def releaseSigningInfo = new File(releaseSigningDirectory, 'keystore-info.properties')
def releaseSigningAvailable = releaseKeystore.isFile() && releaseSigningInfo.isFile()
if (releaseKeystore.exists() != releaseSigningInfo.exists()) {
    throw new GradleException('Both .signing/iptv-release.jks and '
            + '.signing/keystore-info.properties are required for release signing.')
}
def releaseSigningProperties = new Properties()
if (releaseSigningAvailable) {
    releaseSigningInfo.withInputStream { releaseSigningProperties.load(it) }
    ['alias', 'storePassword', 'keyPassword'].each { propertyName ->
        if (!releaseSigningProperties.getProperty(propertyName)) {
            throw new GradleException("Missing ${propertyName} in "
                    + '.signing/keystore-info.properties')
        }
    }
}

android {
    compileSdkVersion 27
    buildToolsVersion '27.0.3'

    signingConfigs {
        if (releaseSigningAvailable) {
            iptvRelease {
                storeFile releaseKeystore
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('alias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId 'xiao.bu.tv'
        minSdkVersion 16
        // API 25 keeps the legacy package-installer flow without declaring
        // REQUEST_INSTALL_PACKAGES, while remaining installable on Android 15.
        targetSdkVersion 25
        versionCode 4
        versionName '1.3.0'

        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.iptvRelease
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jni.srcDirs = []
            jniLibs.srcDirs = ['src/main/libs']
        }
    }
}

dependencies {
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    implementation 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'
}

task generateVersionFile {
    group = 'distribution'
    description = 'Generate the GitHub update manifest at the repository root.'

    doLast {
        File apkFile = project.hasProperty('updateApk')
                ? rootProject.file(project.property('updateApk')) : null
        String sha256 = ''
        if (apkFile != null) {
            if (!apkFile.isFile()) {
                throw new GradleException("Update APK does not exist: ${apkFile}")
            }
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            apkFile.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
            sha256 = digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }

        def manifest = [
                versionCode : android.defaultConfig.versionCode,
                versionName : android.defaultConfig.versionName,
                apkUrl      : "https://github.com/buhanzhe/NativeWasmTv/releases/download/"
                        + "v${android.defaultConfig.versionName}/nTv.apk"
                        + "?versionCode=${android.defaultConfig.versionCode}&signer=iptv-v1",
                sha256      : sha256,
                releaseNotes: project.findProperty('releaseNotes') ?: '修复问题并提升播放体验。'
        ]
        String manifestJson = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n'
        File output = rootProject.file('version.json')
        File clientOutput = rootProject.file('version-iptv.json')
        output.setText(manifestJson, 'UTF-8')
        clientOutput.setText(manifestJson, 'UTF-8')
        logger.lifecycle("Generated ${output} and ${clientOutput}"
                + (sha256 ? " (SHA-256: ${sha256})" : ''))
    }
}
