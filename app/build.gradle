apply plugin: 'com.android.application'

import groovy.json.JsonOutput
import java.security.MessageDigest

def releaseSigningDirectory = rootProject.file('.signing')
def releaseKeystore = new File(releaseSigningDirectory, 'iptv-release.jks')
def releaseSigningInfo = new File(releaseSigningDirectory, 'keystore-info.properties')
def releaseSigningAvailable = releaseKeystore.isFile() && releaseSigningInfo.isFile()
if (releaseKeystore.exists() != releaseSigningInfo.exists()) {
    throw new GradleException('Both .signing/iptv-release.jks and '
            + '.signing/keystore-info.properties are required for release signing.')
}
def releaseSigningProperties = new Properties()
def configuredVersionCode = project.hasProperty('versionCodeOverride')
        ? Integer.parseInt(project.property('versionCodeOverride').toString()) : 5
if (releaseSigningAvailable) {
    releaseSigningInfo.withInputStream { releaseSigningProperties.load(it) }
    ['alias', 'storePassword', 'keyPassword'].each { propertyName ->
        if (!releaseSigningProperties.getProperty(propertyName)) {
            throw new GradleException("Missing ${propertyName} in "
                    + '.signing/keystore-info.properties')
        }
    }
}

android {
    compileSdkVersion 30
    buildToolsVersion '27.0.3'

    signingConfigs {
        if (releaseSigningAvailable) {
            iptvRelease {
                storeFile releaseKeystore
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('alias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    defaultConfig {
        applicationId 'xiao.bu.tv'
        minSdkVersion 16
        // API 25 keeps the legacy package-installer flow without declaring
        // REQUEST_INSTALL_PACKAGES, while remaining installable on Android 15.
        targetSdkVersion 25
        versionCode configuredVersionCode
        versionName '1.5.0'
    }

    flavorDimensions 'architecture'
    productFlavors {
        arm32 {
            dimension 'architecture'
            minSdkVersion 16
            ndk { abiFilters 'armeabi-v7a' }
            buildConfigField 'String', 'UPDATE_APK_URL_FIELD', '"apk32Url"'
            buildConfigField 'String', 'UPDATE_SHA256_FIELD', '"sha25632"'
            buildConfigField 'String', 'UPDATE_APK_ASSET', '"nTv.apk"'
        }
        arm64 {
            dimension 'architecture'
            // Android supports 64-bit native processes from API 21 onward.
            minSdkVersion 21
            ndk { abiFilters 'arm64-v8a' }
            buildConfigField 'String', 'UPDATE_APK_URL_FIELD', '"apk64Url"'
            buildConfigField 'String', 'UPDATE_SHA256_FIELD', '"sha25664"'
            buildConfigField 'String', 'UPDATE_APK_ASSET', '"nTv64.apk"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.iptvRelease
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jni.srcDirs = []
            jniLibs.srcDirs = ['src/main/libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'tv.danmaku.ijk.media:ijkplayer-java:0.8.8'
    arm32Implementation 'tv.danmaku.ijk.media:ijkplayer-armv7a:0.8.8'
    arm64Implementation 'tv.danmaku.ijk.media:ijkplayer-arm64:0.8.8'
}

task generateVersionFile {
    group = 'distribution'
    description = 'Generate the GitHub update manifest at the repository root.'

    doLast {
        Closure<String> fileSha256 = { String propertyName ->
            if (!project.hasProperty(propertyName)) {
                return ''
            }
            File apkFile = rootProject.file(project.property(propertyName))
            if (!apkFile.isFile()) {
                throw new GradleException("Update APK does not exist: ${apkFile}")
            }
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            apkFile.withInputStream { input ->
                byte[] buffer = new byte[64 * 1024]
                int count
                while ((count = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
            return digest.digest().collect { String.format('%02x', it & 0xff) }.join()
        }
        String sha25632 = fileSha256('updateApk32')
        String sha25664 = fileSha256('updateApk64')
        if (!sha25632 || !sha25664) {
            throw new GradleException('Both -PupdateApk32 and -PupdateApk64 are required')
        }
        String releaseBase = 'https://github.com/buhanzhe/NativeWasmTv/releases/latest/download/'

        def manifest = [
                versionCode : android.defaultConfig.versionCode,
                versionName : android.defaultConfig.versionName,
                // apkUrl/sha256 keep every released 32-bit updater backward compatible.
                apkUrl      : releaseBase + 'nTv.apk',
                apk32Url    : releaseBase + 'nTv.apk',
                apk64Url    : releaseBase + 'nTv64.apk',
                sha256      : sha25632,
                sha25632    : sha25632,
                sha25664    : sha25664,
                releaseNotes: project.findProperty('releaseNotes') ?: '修复问题并提升播放体验。'
        ]
        String manifestJson = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + '\n'
        File output = rootProject.file('version.json')
        output.setText(manifestJson, 'UTF-8')
        logger.lifecycle("Generated ${output} (arm32=${sha25632 ?: 'unset'}, "
                + "arm64=${sha25664 ?: 'unset'})")
    }
}
