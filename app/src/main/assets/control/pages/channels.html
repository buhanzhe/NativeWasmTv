<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>频道配置 · nTv</title>
    <script src="/js/theme.js?v=20261030-ui"></script><link rel="stylesheet" href="/css/common.css?v=night-hairline1"><link rel="stylesheet" href="/css/night.css?v=night-hairline1"><link rel="stylesheet" href="/css/channels.css?v=20261111-probe-cancel">
</head>
  <body data-parent="/index.html">
    <main id="channelConfigPage" class="secondary-page channel-config-page">
      <div class="top">
        <button class="back-button" onclick="goBack()">‹ 返回</button>
        <div class="page-title">频道配置</div>
        <div class="online"><span class="dot"></span><span id="channelStatus">电视在线</span></div>
      </div>
      <div class="config-stats channel-summary">
          <span id="configSourceStat" class="config-stat">0 个来源</span
          ><span id="configGroupStat" class="config-stat">等待刷新</span
          ><span id="configChannelStat" class="config-stat">等待电视</span>
        </div>
      <section class="config-source-section">
        <div class="section-head">
          <h2>频道列表</h2>
          <a href="/pages/groups.html">管理分组 ›</a>
        </div>
        <div id="playlistSources" class="source-list"></div>
        <div class="config-actions">
          <button onclick="addPlaylistSource()">添加地址</button
          ><button onclick="openRecommendedSourcePicker()">推荐源</button
          ><button onclick="importBrowserBookmarks()">导入书签</button>
        </div>
        <div id="mergePanel" class="merge-panel" hidden>
          <div class="merge-copy">
            <b id="mergeTitle">准备刷新</b><span id="mergeDetail">选择需要的来源</span>
          </div>
          <div class="merge-progress"><i></i></div>
        </div>
        <button
          id="mergeButton"
          class="primary wide push-button"
          onclick="mergeAndPushPlaylistSources()"
        >
          刷新频道列表
        </button>
        <div class="config-note">支持频道列表及 RTP / UDP / RTSP 单频道地址；修改后刷新，应用到电视。</div>
      </section>
      <section class="config-epg-section">
        <div class="section-head">
          <h2>节目单</h2>
          <input id="epgEnabled" class="source-toggle" aria-label="节目单" type="checkbox" onchange="saveEpgEnabled()" />
        </div>
        <div class="switch-row">
          <div class="switch-copy"><b>显示台标</b></div>
          <input id="epgShowLogos" type="checkbox" disabled aria-label="显示台标" onchange="saveEpgDisplayOption('epgShowLogos')" />
        </div>
        <div class="switch-row">
          <div class="switch-copy"><b>日期选择器</b><div class="hint">多日节目单时显示</div></div>
          <input id="epgDatePicker" type="checkbox" disabled aria-label="日期选择器" onchange="saveEpgDisplayOption('epgDatePicker')" />
        </div>
        <div class="switch-row">
          <div class="switch-copy"><b>显示收藏按钮</b><div class="hint">关闭后仍可长按频道收藏或取消收藏</div></div>
          <input id="epgShowFavorite" type="checkbox" disabled aria-label="显示收藏按钮" onchange="saveEpgDisplayOption('epgShowFavorite')" />
        </div>
        <div id="epgUrls" class="epg-source-list"></div>
        <div class="actions">
          <button onclick="addEpgSource()">添加地址</button
          ><button onclick="useRecommendedEpg()">推荐节目单</button>
        </div>
        <button class="primary wide push-button" onclick="saveEpg()">保存节目单</button>
        <div class="config-note">按地址顺序匹配节目单。</div>
      </section>
      <section>
        <div class="switch-row">
          <div class="switch-copy">
            <b>自动更新频道列表</b>
            <div class="hint">冷启动后台刷新，失败保留原列表。</div>
          </div>
          <input
            id="autoUpdateChannelList"
            aria-label="自动更新频道列表"
            type="checkbox"
            onchange="saveAutoUpdateChannelList()"
          />
        </div>
      </section>
      <section class="browser-section">
        <div class="section-head"><h2>Ku9 脚本</h2></div>
        <div class="browser-settings-list">
          <div class="browser-setting-row">
            <div class="browser-setting-copy">
              <b>上传 JS</b
              ><span id="ku9JsUploadStatus">需安卓5.0及以上</span>
            </div>
            <button id="ku9JsUploadButton" onclick="chooseKu9JsFile()">选择文件</button>
          </div>
        </div>
        <div class="config-note">仅JS，限2MB；同名文件覆盖。</div>
      </section>
      <section class="channel-probe-section">
        <div class="switch-row">
          <div class="switch-copy"><b>邻台探测</b></div>
          <div class="probe-actions">
            <button id="probeAllButton" onclick="probeAllChannels()">全部探测</button>
            <button id="cancelProbeButton" onclick="cancelChannelProbe()" style="display:none">取消</button>
            <input id="neighborProbeEnabled" type="checkbox" aria-label="邻台探测" onchange="saveNeighborProbe()" />
          </div>
        </div>
        <div class="probe-footer">
          <span>自动跳过失效频道</span>
          <span id="channelProbeStatus" aria-live="polite"></span>
        </div>
        <div id="channelProbeProgress" role="progressbar" aria-label="全部探测进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="display:none"><div id="channelProbeFill"></div></div>
        <div id="channelProbeCurrent" class="config-note" aria-live="polite"></div>
      </section>
    </main>
    <div id="message" class="message"></div>
    <div
      id="recommendedSourcePicker"
      class="source-picker"
      onclick="closeRecommendedSourcePicker(event)"
    >
      <div class="source-picker-card" onclick="event.stopPropagation()">
        <div class="source-picker-head">
          <b>选择推荐源</b><button onclick="closeRecommendedSourcePicker()">取消</button>
        </div>
        <div id="recommendedSourceChoices"></div>
      </div>
    </div>
    <input
      id="playlistFilePicker"
      type="file"
      accept=".m3u,.m3u8,.txt,.html,.htm,.json,application/json,text/plain,text/html,application/vnd.apple.mpegurl"
      onchange="playlistFileSelected(this)"
      class="initially-hidden"
    /><input
      id="ku9JsFilePicker"
      type="file"
      accept=".js,text/javascript,application/javascript"
      onchange="ku9JsFileSelected(this)"
      class="initially-hidden"
    />
    <script src="/js/navigation.js?v=20261030-ui"></script>
    <script src="/js/common.js?v=20261103-network"></script>
    <script src="/js/pages/channels.js?v=20261111-probe-cancel"></script>
  <script src="/js/ui.js?v=20261030-ui"></script>
</body>
</html>
