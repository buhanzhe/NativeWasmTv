<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>插件管理 · nTv</title>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/night.css">
  </head>
  <body class="browser-config-shell" data-parent="/">
    <main class="secondary-page channel-config-page">
      <div class="top">
        <button class="back-button" onclick="goBack()">‹ 返回</button>
        <div class="page-title">插件管理</div>
        <div class="online"><span class="dot"></span><span>正在连接</span></div>
      </div>
      <section class="browser-section">
        <div class="section-head"><h2>在线插件</h2><button id="refreshPluginCatalog" type="button" onclick="refreshCatalog(true)">刷新</button></div>
        <div id="pluginCatalogStatus" class="config-note" role="status">正在获取插件列表…</div>
        <div id="pluginCatalog" class="browser-settings-list"></div>
      </section>
      <section class="browser-section">
        <div class="section-head"><h2>上传本地插件</h2></div>
        <div class="browser-settings-list">
          <div class="browser-setting-row">
            <div class="browser-setting-copy"><b>TVBus</b><span id="tvbusStatus">查询中</span></div>
            <button type="button" onclick="choosePlugin('tvbus')">上传 JAR</button>
          </div>
          <div class="browser-setting-row">
            <div class="browser-setting-copy"><b>Python</b><span id="pythonStatus">查询中</span></div>
            <button type="button" onclick="choosePlugin('python')">上传 JAR</button>
          </div>
          <div class="browser-setting-row">
            <div class="browser-setting-copy"><b>BL</b><span id="blStatus">查询中</span></div>
            <button type="button" onclick="choosePlugin('bl')">上传 JAR</button>
          </div>
          <div class="browser-setting-row">
            <div class="browser-setting-copy"><b>TVBox</b><span id="tvboxStatus">查询中</span></div>
            <button type="button" onclick="choosePlugin('tvbox')">上传 JAR</button>
          </div>
        </div>
        <div class="config-note">插件可以在电视上执行代码。请安装你信任的文件。</div>
        <input id="pluginFile" type="file" accept=".jar" hidden onchange="uploadPlugin(this)" aria-label="选择插件文件">
      </section>
      <section class="browser-section">
        <div class="browser-setting-row">
          <div class="browser-setting-copy"><b>文件浏览</b><span id="file-browserStatus">查询中</span></div>
          <button type="button" onclick="choosePlugin('file-browser')">上传 JAR</button>
          <button id="openFiles" type="button" disabled onclick="openPlugin('file-browser')">打开文件浏览</button>
        </div>
        <div class="section-head"><h2>打开频道插件</h2><button id="openBl" type="button" disabled onclick="openPlugin('bl')">打开 BL</button></div>
        <div class="script-import-row">
          <input id="tvboxUrl" type="url" autocomplete="off" placeholder="TVBox 配置地址" aria-label="TVBox 配置地址">
          <button id="openTvbox" type="button" disabled onclick="openPlugin('tvbox')">打开 TVBox</button>
        </div>
        <div class="config-note">TVBox 配置地址会作为频道 JAR 的 url 参数传入。</div>
        <label id="pluginAddress" class="script-import-row" hidden>
          <input id="pluginChannelUrl" type="text" readonly aria-label="频道地址" onclick="this.select()">
        </label>
      </section>
      <section class="browser-section">
        <div class="section-head"><h2>Ku9 Python 脚本</h2><button type="button" onclick="choosePlugin('ku9py')">上传 .py</button></div>
        <div class="script-import-row">
          <input id="ku9pyUrl" type="url" autocomplete="off" placeholder="http://A/example.py?id=1" aria-label="Ku9 Python 播放地址">
          <button id="openKu9py" type="button" disabled onclick="openPlugin('ku9py')">在电视播放</button>
        </div>
        <div class="config-note">上传后可在地址末尾添加脚本所需的参数。播放使用已安装的 Python 插件。</div>
      </section>
      <div id="message" class="message" role="status"></div>
    </main>
    <script src="/js/navigation.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/pages/plugins.js"></script>
    <script src="/js/ui.js"></script>
  </body>
</html>
