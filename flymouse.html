<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <link rel="icon" href="data:,">
  <title>NTV 手机飞鼠</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{background:#f7f7f8}
    body{margin:0;min-height:100vh;color:#1d1d1f;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    main{width:100%;max-width:520px;margin:auto;padding:13px 10px 32px}
    .top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
    .title{font-size:16px;font-weight:750}.online{display:flex;align-items:center;padding:6px 10px;background:#fff;border:1px solid #e8e8eb;border-radius:999px;color:#48484a;font-size:11px;font-weight:650}
    .dot{width:6px;height:6px;margin-right:6px;background:#ff9f0a;border-radius:50%}.online.ok .dot{background:#30d158}.online.bad .dot{background:#ff453a}
    section{padding:13px;background:linear-gradient(180deg,#fff,#fbfffc);border:1px solid #d8e8db;border-radius:16px}
    button,input{font:inherit}button{min-height:42px;padding:9px 11px;border:1px solid #dcdce1;border-radius:12px;background:#fff;color:#1d1d1f;font-weight:650;cursor:pointer}button:active{transform:scale(.975);background:#ebebef}button:disabled{opacity:.42;transform:none}
    .primary{background:#1d1d1f;border-color:#1d1d1f;color:#fff}.actions{display:flex;gap:8px;margin-top:9px}.actions button{flex:1}
    .switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 2px 10px}.switch-copy b{display:block;font-size:13px}.hint{margin:2px 0 0;color:#77777c;font-size:11px;line-height:1.45}
    .switch-row input{-webkit-appearance:none;appearance:none;position:relative;flex:0 0 auto;width:43px;height:26px;padding:0;border:0;border-radius:999px;background:#d2d2d7;outline:none}.switch-row input:before{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.22);transition:transform .2s}.switch-row input:checked{background:#34c759}.switch-row input:checked:before{transform:translateX(17px)}
    .controls{transition:opacity .16s}.controls.off{opacity:.42;pointer-events:none}.touchpad{height:min(46vh,360px);min-height:230px;margin-top:10px;border:1px solid #d7d7dc;border-radius:15px;background:radial-gradient(circle at center,#f7f7f9 0,#eeeef2 100%);display:flex;align-items:center;justify-content:center;color:#77777c;font-size:12px;font-weight:650;touch-action:none;user-select:none}.touchpad.active{border-color:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.12);color:#248a3d}
    .status{margin-top:8px;color:#77777c;font-size:11px;line-height:1.45}.message{position:fixed;left:5%;right:5%;bottom:18px;max-width:460px;margin:auto;padding:11px 14px;background:#1d1d1f;color:#fff;border-radius:12px;display:none;text-align:center;font-size:12px;font-weight:650}.message.bad{background:#ff3b30}
    .setup{display:none;margin-top:10px;border-color:#ffd8a8;background:#fffaf3}.setup.show{display:block}.setup h2{font-size:15px;margin:0 0 8px}.setup p{margin:0;color:#77777c;font-size:11px;line-height:1.55}.address{font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
<main>
  <div class="top"><button onclick="backToManager()">‹ 返回</button><div class="title">手机飞鼠</div><div id="online" class="online"><span class="dot"></span><span id="connectionText">连接中</span></div></div>
  <section>
    <div class="switch-row"><div class="switch-copy"><b>显示电视光标</b><div id="mouseHint" class="hint address">正在连接电视…</div></div><input id="mouseEnabled" aria-label="显示电视光标" type="checkbox" onchange="saveMouseEnabled()"></div>
    <div id="controls" class="controls off">
      <div class="actions"><button id="gyroButton" class="primary" onclick="enableGyroscope()">启用陀螺仪</button><button onclick="calibrateGyroscope()">重新校准</button></div>
      <div id="touchpad" class="touchpad">触摸滑动控制光标 · 轻触点击</div>
      <div class="actions"><button onclick="pointerAction('click')">点击</button><button onclick="pointerAction('back')">电视返回</button><button onclick="pointerAction('reset')">光标居中</button></div>
      <div id="sensorStatus" class="status">点击“启用陀螺仪”，允许动作与方向及本地网络权限。</div>
    </div>
  </section>
  <section id="setup" class="setup"><h2>无法连接电视</h2><p id="setupText"></p></section>
</main>
<div id="message" class="message"></div>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search),host=params.get('ip')||'',port=params.get('port')||'9966';
  var validHost=/^(?:\d{1,3}\.){3}\d{1,3}$/.test(host)||/^[a-z0-9.-]+$/i.test(host),validPort=/^\d{1,5}$/.test(port)&&Number(port)>0&&Number(port)<65536;
  var apiBase=validHost&&validPort?'http://'+host+':'+port:'',targetAddressSpace=/^(127\.|localhost$)/i.test(host)?'loopback':'local';
  var state=null,pointerBusy=false,pendingDx=0,pendingDy=0,messageTimer=null;
  var gyroRunning=false,gyroSeen=false,orientationSeen=false,gyroMode='',gyroX=null,gyroY=null,baseX=null,baseY=null,genericGyroscope=null;
  window.backToManager=function(){if(apiBase)location.href=apiBase+'/index.html';else history.back()};
  function request(path,body){if(!apiBase)return Promise.reject(new Error('地址参数无效'));var options={method:body?'POST':'GET',mode:'cors',cache:'no-store',targetAddressSpace:targetAddressSpace,headers:{'Accept':'application/json'}};if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}return fetch(apiBase+path,options).then(function(response){if(!response.ok)throw new Error('电视返回 '+response.status);return response.json()}).then(function(data){if(data.ok===false)throw new Error(data.message||'请求失败');return data})}
  function setConnection(ok,text){var online=document.getElementById('online');online.className='online '+(ok?'ok':'bad');document.getElementById('connectionText').textContent=text}
  function showSetup(text){document.getElementById('setup').className='setup show';document.getElementById('setupText').textContent=text}
  function connect(){if(!apiBase){setConnection(false,'地址无效');showSetup('请使用 ?ip=电视IP&port=端口 打开本页，例如：?ip=192.168.1.20&port=9966');return}request('/api/state').then(function(data){state=data;setConnection(true,'电视在线');document.getElementById('setup').className='setup';var input=document.getElementById('mouseEnabled');input.checked=data.settings.flyMouseEnabled===true;updateControls()}).catch(function(error){setConnection(false,'连接失败');showSetup('请确认手机与电视在同一局域网，并允许浏览器访问本地网络。目标：'+apiBase+'。'+error.message)})}
  function updateControls(){var enabled=document.getElementById('mouseEnabled').checked,controls=document.getElementById('controls'),buttons=controls.getElementsByTagName('button');controls.className='controls'+(enabled?'':' off');document.getElementById('mouseHint').textContent=enabled?'电视光标已开启':(apiBase?host+':'+port:'未配置电视地址');for(var i=0;i<buttons.length;i++)buttons[i].disabled=!enabled}
  window.saveMouseEnabled=function(){var input=document.getElementById('mouseEnabled');updateControls();request('/api/settings',{flyMouseEnabled:input.checked}).then(function(){if(state)state.settings.flyMouseEnabled=input.checked;toast(input.checked?'电视光标已开启':'电视光标已关闭')}).catch(function(error){input.checked=!input.checked;updateControls();toast(error.message,true)})};
  function pointerMove(dx,dy){pendingDx=Math.max(-240,Math.min(240,pendingDx+dx));pendingDy=Math.max(-240,Math.min(240,pendingDy+dy));flushPointerMove()}
  function flushPointerMove(){if(pointerBusy||Math.abs(pendingDx)+Math.abs(pendingDy)<.15)return;var dx=pendingDx,dy=pendingDy;pendingDx=0;pendingDy=0;pointerBusy=true;request('/api/pointer',{action:'move',dx:dx,dy:dy}).catch(function(error){setSensorStatus(error.message,true)}).then(function(){pointerBusy=false;flushPointerMove()})}
  window.pointerAction=function(action,value){var body={action:action};if(action==='scroll')body.scrollY=value||0;request('/api/pointer',body).then(function(){if(action==='reset')toast('电视光标已居中')}).catch(function(error){toast(error.message,true)})};
  function setSensorStatus(text,bad){var element=document.getElementById('sensorStatus');element.textContent=text;element.style.color=bad?'#ff3b30':'#248a3d'}
  window.enableGyroscope=function(){if(!document.getElementById('mouseEnabled').checked){toast('请先开启电视光标',true);return}var requests=[],denied=false;if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')requests.push(function(){return DeviceOrientationEvent.requestPermission()});if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')requests.push(function(){return DeviceMotionEvent.requestPermission()});if(!requests.length){startGyroscope();return}var remaining=requests.length;function finished(result){if(result!=='granted')denied=true;remaining--;if(!remaining){if(denied)setSensorStatus('动作与方向权限未开启，请在浏览器网站设置中允许。',true);else startGyroscope()}}for(var i=0;i<requests.length;i++){try{var promise=requests[i]();if(promise&&promise.then)promise.then(finished,function(){finished('denied')});else finished('granted')}catch(error){finished('denied')}}};
  function startGyroscope(){if(!gyroRunning){window.addEventListener('deviceorientation',onOrientation,true);window.addEventListener('deviceorientationabsolute',onOrientation,true);window.addEventListener('devicemotion',onMotion,true);startGenericGyroscope();gyroRunning=true;gyroSeen=false;orientationSeen=false}baseX=null;baseY=null;document.getElementById('gyroButton').textContent='陀螺仪已启动';setSensorStatus('正在等待传感器数据，请轻轻转动手机…',false);setTimeout(function(){if(!gyroSeen){setSensorStatus('未收到传感器数据，请检查浏览器动作与方向权限。',true);document.getElementById('gyroButton').textContent='重新启用陀螺仪'}},3000)}
  function onOrientation(event){if(typeof event.beta!=='number'||typeof event.gamma!=='number')return;gyroSeen=true;orientationSeen=true;gyroMode='tilt';gyroX=event.gamma;gyroY=event.beta;if(baseX===null||baseY===null){baseX=gyroX;baseY=gyroY}sensorReady('方向传感器')}
  function onMotion(event){if(orientationSeen)return;var rate=event.rotationRate;if(rate&&typeof rate.beta==='number'&&typeof rate.gamma==='number'){gyroSeen=true;gyroMode='rate';gyroX=rate.gamma;gyroY=rate.beta;sensorReady('陀螺仪');return}var gravity=event.accelerationIncludingGravity;if(gravity&&typeof gravity.x==='number'&&typeof gravity.y==='number'){gyroSeen=true;gyroMode='tilt';gyroX=-gravity.x*5;gyroY=gravity.y*5;if(baseX===null||baseY===null){baseX=gyroX;baseY=gyroY}sensorReady('重力传感器')}}
  function startGenericGyroscope(){if(typeof Gyroscope==='undefined')return;try{genericGyroscope=new Gyroscope({frequency:20});genericGyroscope.addEventListener('reading',function(){if(orientationSeen)return;gyroSeen=true;gyroMode='rate';gyroX=genericGyroscope.y*57.3;gyroY=genericGyroscope.x*57.3;sensorReady('陀螺仪')});genericGyroscope.addEventListener('error',function(){});genericGyroscope.start()}catch(error){genericGyroscope=null}}
  function sensorReady(name){document.getElementById('gyroButton').textContent='陀螺仪运行中';setSensorStatus(name+'控制中 · 点击“重新校准”可重设中心',false)}
  window.calibrateGyroscope=function(){baseX=gyroX;baseY=gyroY;if(gyroSeen)setSensorStatus('已校准，以当前握持姿态为中心。',false);else setSensorStatus('请先启用陀螺仪并轻轻转动手机。',true)};
  function gyroSpeed(value){var sign=value<0?-1:1,amount=Math.abs(value);if(amount<1.4)return 0;return sign*Math.min(22,(amount-1.4)*.52)}function rateSpeed(value){var sign=value<0?-1:1,amount=Math.abs(value);if(amount<2)return 0;return sign*Math.min(22,(amount-2)*.09)}
  setInterval(function(){if(!gyroRunning||!gyroSeen||gyroX===null||gyroY===null)return;var x=gyroMode==='rate'?gyroX:gyroX-baseX,y=gyroMode==='rate'?gyroY:gyroY-baseY,angle=Number(window.orientation||0),rx=x,ry=y;if(angle===90){rx=-y;ry=x}else if(angle===-90||angle===270){rx=y;ry=-x}else if(Math.abs(angle)===180){rx=-x;ry=-y}var dx=gyroMode==='rate'?rateSpeed(rx):gyroSpeed(rx),dy=gyroMode==='rate'?rateSpeed(ry):gyroSpeed(ry);if(dx||dy)pointerMove(dx,dy)},50);
  function setupTouchpad(){var pad=document.getElementById('touchpad'),lastX=0,lastY=0,moved=false,mouseDown=false;function begin(x,y){lastX=x;lastY=y;moved=false;pad.className='touchpad active'}function move(x,y){var dx=x-lastX,dy=y-lastY;lastX=x;lastY=y;if(Math.abs(dx)+Math.abs(dy)>1)moved=true;pointerMove(dx*1.35,dy*1.35)}function end(){pad.className='touchpad';if(!moved)window.pointerAction('click')}pad.addEventListener('touchstart',function(event){if(!event.touches.length)return;begin(event.touches[0].clientX,event.touches[0].clientY);event.preventDefault()},{passive:false});pad.addEventListener('touchmove',function(event){if(!event.touches.length)return;move(event.touches[0].clientX,event.touches[0].clientY);event.preventDefault()},{passive:false});pad.addEventListener('touchend',function(event){end();event.preventDefault()},{passive:false});pad.addEventListener('mousedown',function(event){mouseDown=true;begin(event.clientX,event.clientY);event.preventDefault()});document.addEventListener('mousemove',function(event){if(mouseDown)move(event.clientX,event.clientY)});document.addEventListener('mouseup',function(){if(mouseDown){mouseDown=false;end()}});pad.addEventListener('wheel',function(event){window.pointerAction('scroll',event.deltaY);event.preventDefault()},{passive:false})}
  function toast(text,bad){var element=document.getElementById('message');element.textContent=text;element.className='message'+(bad?' bad':'');element.style.display='block';clearTimeout(messageTimer);messageTimer=setTimeout(function(){element.style.display='none'},bad?5000:2600)}
  setupTouchpad();updateControls();connect();
})();
</script>
</body>
</html>
