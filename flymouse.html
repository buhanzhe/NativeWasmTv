<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <link rel="icon" href="data:,">
  <title>NTV 手机飞鼠</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{background:#f7f7f8}
    body{margin:0;min-height:100vh;color:#1d1d1f;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    main{width:100%;max-width:520px;margin:auto;padding:13px 10px 32px}
    .top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px}
    .title{font-size:16px;font-weight:750}.online{display:flex;align-items:center;padding:6px 10px;background:#fff;border:1px solid #e8e8eb;border-radius:999px;color:#48484a;font-size:11px;font-weight:650}
    .dot{width:6px;height:6px;margin-right:6px;background:#ff9f0a;border-radius:50%}.online.ok .dot{background:#30d158}.online.bad .dot{background:#ff453a}
    section{padding:13px;background:linear-gradient(180deg,#fff,#fbfffc);border:1px solid #d8e8db;border-radius:16px}
    button,input{font:inherit}button{min-height:42px;padding:9px 11px;border:1px solid #dcdce1;border-radius:12px;background:#fff;color:#1d1d1f;font-weight:650;cursor:pointer}button:active{transform:scale(.975);background:#ebebef}button:disabled{opacity:.42;transform:none}
    .primary{background:#1d1d1f;border-color:#1d1d1f;color:#fff}.actions{display:flex;gap:8px;margin-top:9px}.actions button{flex:1}
    .switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:2px 2px 10px}.switch-copy b{display:block;font-size:13px}.hint{margin:2px 0 0;color:#77777c;font-size:11px;line-height:1.45}
    .switch-row input{-webkit-appearance:none;appearance:none;position:relative;flex:0 0 auto;width:43px;height:26px;padding:0;border:0;border-radius:999px;background:#d2d2d7;outline:none}.switch-row input:before{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.22);transition:transform .2s}.switch-row input:checked{background:#34c759}.switch-row input:checked:before{transform:translateX(17px)}
    .controls{transition:opacity .16s}.controls.off{opacity:.42;pointer-events:none}.touchpad{height:min(46vh,360px);min-height:230px;margin-top:10px;border:1px solid #d7d7dc;border-radius:15px;background:radial-gradient(circle at center,#f7f7f9 0,#eeeef2 100%);display:flex;align-items:center;justify-content:center;color:#77777c;font-size:12px;font-weight:650;touch-action:none;user-select:none}.touchpad.active{border-color:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.12);color:#248a3d}
    .status{margin-top:8px;color:#77777c;font-size:11px;line-height:1.45}.message{position:fixed;left:5%;right:5%;bottom:18px;max-width:460px;margin:auto;padding:11px 14px;background:#1d1d1f;color:#fff;border-radius:12px;display:none;text-align:center;font-size:12px;font-weight:650}.message.bad{background:#ff3b30}
    .setup{display:none;margin-top:10px;border-color:#ffd8a8;background:#fffaf3}.setup.show{display:block}.setup h2{font-size:15px;margin:0 0 8px}.setup p{margin:0;color:#77777c;font-size:11px;line-height:1.55}.address{font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
<main>
  <div class="top"><button onclick="backToManager()">‹ 返回</button><div class="title">手机飞鼠</div><div id="online" class="online"><span class="dot"></span><span id="connectionText">连接中</span></div></div>
  <section>
    <div class="switch-row"><div class="switch-copy"><b>显示电视光标</b><div id="mouseHint" class="hint address">正在连接电视…</div></div><input id="mouseEnabled" aria-label="显示电视光标" type="checkbox" onchange="saveMouseEnabled()"></div>
    <div id="controls" class="controls off">
      <div class="actions"><button id="gyroButton" class="primary" onclick="enableGyroscope()">启用陀螺仪</button><button onclick="calibrateGyroscope()">重新校准</button></div>
      <div id="touchpad" class="touchpad">慢移精确 · 快划加速 · 轻触点击</div>
      <div class="actions"><button onclick="pointerAction('click')">点击</button><button onclick="pointerAction('back')">电视返回</button><button onclick="pointerAction('reset')">光标居中</button></div>
      <div id="sensorStatus" class="status">像遥控器一样握持；移动、指向或旋转手机控制光标。</div>
    </div>
  </section>
  <section id="setup" class="setup"><h2>无法连接电视</h2><p id="setupText"></p></section>
</main>
<div id="message" class="message"></div>
<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search),host=params.get('ip')||'',port=params.get('port')||'9966';
  var validHost=/^(?:\d{1,3}\.){3}\d{1,3}$/.test(host)||/^[a-z0-9.-]+$/i.test(host),validPort=/^\d{1,5}$/.test(port)&&Number(port)>0&&Number(port)<65536;
  var apiBase=validHost&&validPort?'http://'+host+':'+port:'',targetAddressSpace=/^(127\.|localhost$)/i.test(host)?'loopback':'local';
  var state=null,pointerBusy=false,pendingDx=0,pendingDy=0,messageTimer=null,pointerScale=1;
  var gyroRunning=false,gyroSeen=false,gyroYawRate=0,gyroPitchRate=0,gyroRollRate=0,filteredYawRate=0,filteredPitchRate=0,gyroHasYaw=false,genericGyroscope=null,lastSensorName='',lastSensorAt=0,lastRateAt=0,lastMotionRateAt=0,lastOrientationRateAt=0,lastOrientationAlpha=null,lastOrientationBeta=null,lastOrientationGamma=null,lastOrientationAt=0,orientationEventType='',lastGravityPitch=null,lastGravityAt=0,lastGyroFrameAt=0,gravityFlatWeight=1,lastMotionAt=0,lastTranslationAt=0,filteredAccelX=0,filteredAccelY=0,translationVelocityX=0,translationVelocityY=0;
  window.backToManager=function(){if(apiBase)location.href=apiBase+'/index.html';else history.back()};
  function request(path,body){if(!apiBase)return Promise.reject(new Error('地址参数无效'));var options={method:body?'POST':'GET',mode:'cors',cache:'no-store',targetAddressSpace:targetAddressSpace,headers:{'Accept':'application/json'}};if(body){options.headers['Content-Type']='application/json';options.body=JSON.stringify(body)}return fetch(apiBase+path,options).then(function(response){if(!response.ok)throw new Error('电视返回 '+response.status);return response.json()}).then(function(data){if(data.ok===false)throw new Error(data.message||'请求失败');return data})}
  function setConnection(ok,text){var online=document.getElementById('online');online.className='online '+(ok?'ok':'bad');document.getElementById('connectionText').textContent=text}
  function showSetup(text){document.getElementById('setup').className='setup show';document.getElementById('setupText').textContent=text}
  function connect(){if(!apiBase){setConnection(false,'地址无效');showSetup('请使用 ?ip=电视IP&port=端口 打开本页，例如：?ip=192.168.1.20&port=9966');return}request('/api/state').then(function(data){state=data;var width=data.display&&Number(data.display.width);pointerScale=width>0?Math.max(.75,Math.min(3,width/1280)):1;setConnection(true,'电视在线');document.getElementById('setup').className='setup';var input=document.getElementById('mouseEnabled');input.checked=data.settings.flyMouseEnabled===true;updateControls()}).catch(function(error){setConnection(false,'连接失败');showSetup('请确认手机与电视在同一局域网，并允许浏览器访问本地网络。目标：'+apiBase+'。'+error.message)})}
  function updateControls(){var enabled=document.getElementById('mouseEnabled').checked,controls=document.getElementById('controls'),buttons=controls.getElementsByTagName('button');controls.className='controls'+(enabled?'':' off');document.getElementById('mouseHint').textContent=enabled?'电视光标已开启':(apiBase?host+':'+port:'未配置电视地址');for(var i=0;i<buttons.length;i++)buttons[i].disabled=!enabled}
  window.saveMouseEnabled=function(){var input=document.getElementById('mouseEnabled');updateControls();request('/api/settings',{flyMouseEnabled:input.checked}).then(function(){if(state)state.settings.flyMouseEnabled=input.checked;toast(input.checked?'电视光标已开启':'电视光标已关闭')}).catch(function(error){input.checked=!input.checked;updateControls();toast(error.message,true)})};
  function pointerMove(dx,dy){pendingDx=Math.max(-240,Math.min(240,pendingDx+dx));pendingDy=Math.max(-240,Math.min(240,pendingDy+dy));flushPointerMove()}
  function flushPointerMove(){if(pointerBusy||Math.abs(pendingDx)+Math.abs(pendingDy)<.15)return;var dx=pendingDx,dy=pendingDy;pendingDx=0;pendingDy=0;pointerBusy=true;request('/api/pointer',{action:'move',dx:dx,dy:dy}).catch(function(error){setSensorStatus(error.message,true)}).then(function(){pointerBusy=false;flushPointerMove()})}
  window.pointerAction=function(action,value){var body={action:action};if(action==='scroll')body.scrollY=value||0;request('/api/pointer',body).then(function(){if(action==='reset')toast('电视光标已居中')}).catch(function(error){toast(error.message,true)})};
  function setSensorStatus(text,bad){var element=document.getElementById('sensorStatus');element.textContent=text;element.style.color=bad?'#ff3b30':'#248a3d'}
  window.enableGyroscope=function(){if(gyroRunning){stopGyroscope();return}if(!document.getElementById('mouseEnabled').checked){toast('请先开启电视光标',true);return}var requests=[],denied=false;if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function')requests.push(function(){return DeviceOrientationEvent.requestPermission()});if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function')requests.push(function(){return DeviceMotionEvent.requestPermission()});if(!requests.length){startGyroscope();return}var remaining=requests.length;function finished(result){if(result!=='granted')denied=true;remaining--;if(!remaining){if(denied)setSensorStatus('动作与方向权限未开启，请在浏览器网站设置中允许。',true);else startGyroscope()}}for(var i=0;i<requests.length;i++){try{var promise=requests[i]();if(promise&&promise.then)promise.then(finished,function(){finished('denied')});else finished('granted')}catch(error){finished('denied')}}};
  function resetMotionTracking(){gyroYawRate=0;gyroPitchRate=0;gyroRollRate=0;filteredYawRate=0;filteredPitchRate=0;lastSensorAt=0;lastRateAt=0;lastMotionRateAt=0;lastOrientationRateAt=0;lastOrientationAlpha=null;lastOrientationBeta=null;lastOrientationGamma=null;lastOrientationAt=0;orientationEventType='';lastGravityPitch=null;lastGravityAt=0;lastGyroFrameAt=0;lastMotionAt=0;lastTranslationAt=0;filteredAccelX=0;filteredAccelY=0;translationVelocityX=0;translationVelocityY=0}
  function startGyroscope(){if(!gyroRunning){window.addEventListener('deviceorientation',onOrientation,true);window.addEventListener('deviceorientationabsolute',onOrientation,true);window.addEventListener('devicemotion',onMotion,true);startGenericGyroscope();gyroRunning=true}gyroSeen=false;lastSensorName='';resetMotionTracking();document.getElementById('gyroButton').textContent='关闭陀螺仪';setSensorStatus('请像遥控器一样握持手机，然后移动或转动…',false);setTimeout(function(){if(gyroRunning&&!gyroSeen)setSensorStatus('未收到传感器数据，请检查浏览器动作与方向权限。',true)},3000)}
  function stopGyroscope(){window.removeEventListener('deviceorientation',onOrientation,true);window.removeEventListener('deviceorientationabsolute',onOrientation,true);window.removeEventListener('devicemotion',onMotion,true);if(genericGyroscope){try{genericGyroscope.stop()}catch(error){}genericGyroscope=null}gyroRunning=false;gyroSeen=false;lastSensorName='';resetMotionTracking();document.getElementById('gyroButton').textContent='启用陀螺仪';setSensorStatus('陀螺仪已关闭，仍可使用触控板。',false)}
  function angleDelta(value,center){return(value-center+540)%360-180}
  function displayAngle(){var value=0;if(typeof screen!=='undefined'&&screen.orientation&&typeof screen.orientation.angle==='number')value=screen.orientation.angle;else if(typeof window.orientation==='number')value=window.orientation;return((Math.round(value/90)*90)%360+360)%360}
  function screenAxes(x,y){var angle=displayAngle();if(angle===90)return[y,-x];if(angle===180)return[-x,-y];if(angle===270)return[-y,x];return[x,y]}
  function fusedRotationRates(alpha,beta,gamma){var axes=screenAxes(beta,gamma);return{horizontal:alpha,vertical:axes[0],roll:alpha}}
  function updatePosture(gravity){if(!gravity||typeof gravity.z!=='number')return;var x=Number(gravity.x)||0,y=Number(gravity.y)||0,z=Number(gravity.z)||0,magnitude=Math.sqrt(x*x+y*y+z*z);if(magnitude<1)return;var target=Math.max(0,Math.min(1,Math.abs(z)/magnitude));gravityFlatWeight+=(target-gravityFlatWeight)*.18}
  function accelerationDeadzone(value){var sign=value<0?-1:1,amount=Math.abs(value);return amount<.18?0:sign*(amount-.18)}
  function updateTranslation(acceleration,now,rotationPeak){if(!acceleration||typeof acceleration.x!=='number'||typeof acceleration.y!=='number'){lastMotionAt=now;return}var elapsed=lastMotionAt?Math.max(.008,Math.min(.06,(now-lastMotionAt)/1000)):.016;lastMotionAt=now;var axes=screenAxes(acceleration.x,acceleration.y),rotationGain=rotationPeak>45?0:rotationPeak>20?.45:1;filteredAccelX=filteredAccelX*.5+Math.max(-8,Math.min(8,axes[0]))*.5;filteredAccelY=filteredAccelY*.5+Math.max(-8,Math.min(8,axes[1]))*.5;var ax=accelerationDeadzone(filteredAccelX)*rotationGain,ay=accelerationDeadzone(filteredAccelY)*rotationGain,oldX=translationVelocityX,oldY=translationVelocityY;translationVelocityX+=ax*elapsed;translationVelocityY+=ay*elapsed;if(oldX*translationVelocityX<0&&Math.abs(ax)>.45)translationVelocityX=0;if(oldY*translationVelocityY<0&&Math.abs(ay)>.45)translationVelocityY=0;var active=Math.abs(ax)+Math.abs(ay)>.08,damping=Math.exp(-(active?1.4:5.5)*elapsed);translationVelocityX=Math.max(-1.2,Math.min(1.2,translationVelocityX*damping));translationVelocityY=Math.max(-1.2,Math.min(1.2,translationVelocityY*damping));if(Math.abs(translationVelocityX)<.006)translationVelocityX=0;if(Math.abs(translationVelocityY)<.006)translationVelocityY=0;lastTranslationAt=now;if(active){gyroSeen=true;sensorReady('六轴运动传感器')}}
  function onOrientation(event){if(typeof event.alpha!=='number'||typeof event.beta!=='number')return;if(!orientationEventType)orientationEventType=event.type||'deviceorientation';if((event.type||'deviceorientation')!==orientationEventType)return;var now=Date.now(),gamma=typeof event.gamma==='number'?event.gamma:0;if(lastOrientationAt&&now-lastOrientationAt>=12&&now-lastOrientationAt<=250){var seconds=(now-lastOrientationAt)/1000,alphaRate=angleDelta(event.alpha,lastOrientationAlpha)/seconds,betaRate=angleDelta(event.beta,lastOrientationBeta)/seconds,gammaRate=lastOrientationGamma===null?0:angleDelta(gamma,lastOrientationGamma)/seconds,rates=fusedRotationRates(alphaRate,betaRate,gammaRate);gyroYawRate=rates.horizontal;gyroPitchRate=rates.vertical;gyroRollRate=rates.roll;gyroHasYaw=true;gyroSeen=true;lastOrientationRateAt=now;lastRateAt=now;lastSensorAt=now;sensorReady('方向传感器 Alpha/Beta')}lastOrientationAlpha=event.alpha;lastOrientationBeta=event.beta;lastOrientationGamma=gamma;lastOrientationAt=now}
  function onMotion(event){var now=Date.now(),rate=event.rotationRate,gravity=event.accelerationIncludingGravity;updatePosture(gravity);if(now-lastOrientationRateAt<250)return;var alpha=rate&&typeof rate.alpha==='number'?rate.alpha:0,beta=rate&&typeof rate.beta==='number'?rate.beta:0,gamma=rate&&typeof rate.gamma==='number'?rate.gamma:0,hasRate=rate&&(typeof rate.alpha==='number'||typeof rate.beta==='number'||typeof rate.gamma==='number');if(hasRate){var rates=fusedRotationRates(alpha,beta,gamma);gyroSeen=true;gyroHasYaw=typeof rate.alpha==='number';gyroYawRate=rates.horizontal;gyroPitchRate=rates.vertical;gyroRollRate=rates.roll;lastMotionRateAt=now;lastRateAt=now;lastSensorAt=now;sensorReady('角速度备用传感器');return}if(now-lastRateAt<=300)return;if(gravity&&typeof gravity.y==='number'&&typeof gravity.z==='number'){var axes=screenAxes(Number(gravity.x)||0,Number(gravity.y)||0),pitch=Math.atan2(axes[1],Math.sqrt(axes[0]*axes[0]+gravity.z*gravity.z))*180/Math.PI;if(lastGravityAt&&now-lastGravityAt>=12&&now-lastGravityAt<=250){gyroSeen=true;gyroHasYaw=false;gyroYawRate=0;gyroPitchRate=(pitch-lastGravityPitch)/((now-lastGravityAt)/1000);lastSensorAt=now;sensorReady('重力传感器（仅上下）')}lastGravityPitch=pitch;lastGravityAt=now}}
  function startGenericGyroscope(){if(typeof Gyroscope==='undefined')return;try{genericGyroscope=new Gyroscope({frequency:30});genericGyroscope.addEventListener('reading',function(){var now=Date.now();if(now-lastOrientationRateAt<250||now-lastMotionRateAt<250)return;var rates=fusedRotationRates(genericGyroscope.z*57.2958,genericGyroscope.x*57.2958,genericGyroscope.y*57.2958);gyroSeen=true;gyroHasYaw=true;gyroYawRate=rates.horizontal;gyroPitchRate=rates.vertical;gyroRollRate=rates.roll;lastRateAt=now;lastSensorAt=now;sensorReady('陀螺仪备用传感器')});genericGyroscope.addEventListener('error',function(){});genericGyroscope.start()}catch(error){genericGyroscope=null}}
  function sensorReady(name){document.getElementById('gyroButton').textContent='关闭陀螺仪';if(name!==lastSensorName){lastSensorName=name;setSensorStatus(name+'控制中 · 转动时移动，停下即停止',false)}}
  window.calibrateGyroscope=function(){if(!gyroSeen){setSensorStatus('请先启用传感器并轻轻移动手机。',true);return}resetMotionTracking();setSensorStatus('动态基准已重置，请保持当前握持姿势。',false)};
  function clampRate(value){return Math.max(-720,Math.min(720,value))}function pointerRateVector(horizontal,vertical){var horizontalGain=1.75+Math.min(1.25,Math.abs(horizontal)/48),x=horizontal*horizontalGain,y=vertical,magnitude=Math.sqrt(x*x+y*y);if(magnitude<.9)return{x:0,y:0};var adjusted=magnitude-.9,speed=adjusted*13+Math.pow(Math.max(0,magnitude-8),1.15)*15,scale=Math.min(5000,speed)/magnitude;return{x:x*scale,y:y*scale}}
  setInterval(function(){if(!gyroRunning||!gyroSeen)return;var now=Date.now(),elapsed=lastGyroFrameAt?Math.max(.008,Math.min(.04,(now-lastGyroFrameAt)/1000)):.016;lastGyroFrameAt=now;var fresh=now-lastSensorAt<120,rawYaw=fresh&&gyroHasYaw?clampRate(gyroYawRate):0,rawPitch=fresh?clampRate(gyroPitchRate):0,peak=Math.max(Math.abs(rawYaw),Math.abs(rawPitch)),blend=peak>8?.76:.5;filteredYawRate+=(rawYaw-filteredYawRate)*blend;filteredPitchRate+=(rawPitch-filteredPitchRate)*blend;if(Math.abs(filteredYawRate)<.24)filteredYawRate=0;if(Math.abs(filteredPitchRate)<.24)filteredPitchRate=0;var velocity=pointerRateVector(filteredYawRate,filteredPitchRate),dx=-velocity.x*elapsed*pointerScale,dy=-velocity.y*elapsed*pointerScale;if(dx||dy)pointerMove(dx,dy)},16);
  function setupTouchpad(){var pad=document.getElementById('touchpad'),lastX=0,lastY=0,lastAt=0,filteredSpeed=0,travel=0,moved=false,mouseDown=false;function now(){return window.performance&&typeof window.performance.now==='function'?window.performance.now():Date.now()}function begin(x,y){lastX=x;lastY=y;lastAt=now();filteredSpeed=0;travel=0;moved=false;pad.className='touchpad active'}function move(x,y){var time=now(),dx=x-lastX,dy=y-lastY,elapsed=Math.max(8,Math.min(80,time-lastAt||16)),distance=Math.sqrt(dx*dx+dy*dy),speed=distance/elapsed;lastX=x;lastY=y;lastAt=time;travel+=distance;if(travel>3)moved=true;filteredSpeed=filteredSpeed*.58+speed*.42;var gain=.82+Math.min(2.18,Math.pow(filteredSpeed/.35,.72)*.55);pointerMove(dx*gain*pointerScale,dy*gain*pointerScale)}function end(){pad.className='touchpad';filteredSpeed=0;if(!moved)window.pointerAction('click')}pad.addEventListener('touchstart',function(event){if(!event.touches.length)return;begin(event.touches[0].clientX,event.touches[0].clientY);event.preventDefault()},{passive:false});pad.addEventListener('touchmove',function(event){if(!event.touches.length)return;move(event.touches[0].clientX,event.touches[0].clientY);event.preventDefault()},{passive:false});pad.addEventListener('touchend',function(event){end();event.preventDefault()},{passive:false});pad.addEventListener('mousedown',function(event){mouseDown=true;begin(event.clientX,event.clientY);event.preventDefault()});document.addEventListener('mousemove',function(event){if(mouseDown)move(event.clientX,event.clientY)});document.addEventListener('mouseup',function(){if(mouseDown){mouseDown=false;end()}});pad.addEventListener('wheel',function(event){window.pointerAction('scroll',event.deltaY);event.preventDefault()},{passive:false})}
  function toast(text,bad){var element=document.getElementById('message');element.textContent=text;element.className='message'+(bad?' bad':'');element.style.display='block';clearTimeout(messageTimer);messageTimer=setTimeout(function(){element.style.display='none'},bad?5000:2600)}
  setupTouchpad();updateControls();connect();
})();
</script>
</body>
</html>
